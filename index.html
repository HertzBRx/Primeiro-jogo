<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazendinha Renascida</title>
<style>
  :root {
    --madeira: #8b5a2b;
    --madeira-escura: #5e3b1a;
    --papel: #fff8e7;
    --papel-escuro: #f3e6c4;
    --texto: #4a3020;
    --verde: #5cae3e;
    --verde-escuro: #3d7f28;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(#a8dcff 0%, #d6f0ff 45%, #e6f5cf 100%);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    color: var(--texto);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Barra do topo ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 16px;
    background: var(--madeira);
    border-bottom: 4px solid var(--madeira-escura);
    color: #fff8e7;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  header h1 {
    margin: 0; font-size: 20px; letter-spacing: .5px;
    text-shadow: 2px 2px 0 var(--madeira-escura);
    white-space: nowrap;
  }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .stat {
    background: var(--papel); color: var(--texto);
    border: 3px solid var(--madeira-escura); border-radius: 10px;
    padding: 4px 10px; font-weight: bold; white-space: nowrap;
    box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .stat.moedas { background: #fff1b8; font-size: 20px; min-width: 150px; text-align: center; }
  .stat small { font-weight: normal; opacity: .8; }
  .botoes-topo { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: bold; cursor: pointer;
    border: 3px solid var(--madeira-escura); border-radius: 10px;
    padding: 5px 10px; background: var(--papel); color: var(--texto);
    box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--madeira-escura); }
  .btn.perigo { background: #ffd6cf; }
  .btn.desligado { background: #ddd2bd; color: #8a7a66; }
  .btn.desligado .rotulo-som { text-decoration: line-through; }

  /* ---------- Layout principal ---------- */
  main {
    display: flex; gap: 16px; align-items: flex-start;
    max-width: 1440px; margin: 0 auto; padding: 16px;
  }
  .painel {
    background: var(--papel);
    border: 4px solid var(--madeira); border-radius: 14px;
    box-shadow: 0 5px 0 var(--madeira-escura);
  }
  .fazenda-col { flex: 1.8; min-width: 0; }
  .loja-col { flex: 1; min-width: 300px; max-width: 440px; }

  .fazenda-wrap {
    position: relative; padding: 8px; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  canvas#fazenda {
    display: block; width: 100%; height: auto;
    aspect-ratio: 400 / 260;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 8px; cursor: pointer;
    touch-action: manipulation;
  }
  .dica { text-align: center; padding: 4px 10px 8px; font-size: 14px; }
  .progresso { padding: 0 12px 12px; }
  .barra {
    height: 14px; background: var(--papel-escuro);
    border: 2px solid var(--madeira-escura); border-radius: 8px; overflow: hidden;
  }
  .barra > div {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(45deg, var(--verde) 0 8px, #6cc24a 8px 16px);
    transition: width .4s;
  }
  .progresso .rotulo { font-size: 13px; margin-bottom: 4px; display: flex; justify-content: space-between; }

  .flutua {
    position: absolute; pointer-events: none;
    font-weight: bold; font-size: 20px; color: #ffe066;
    text-shadow: 2px 2px 0 #7a4a12, -1px -1px 0 #7a4a12, 1px -1px 0 #7a4a12, -1px 1px 0 #7a4a12;
    transform: translate(-50%, -50%);
    animation: sobe .9s ease-out forwards;
    white-space: nowrap; z-index: 5;
  }
  @keyframes sobe {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(.7); }
    20%  { transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
  }

  /* ---------- Loja ---------- */
  .loja-titulo { margin: 0; padding: 10px 14px 4px; font-size: 20px; }
  .abas { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px; }
  .aba {
    position: relative; flex: 1 1 auto;
    font: inherit; font-size: 13px; font-weight: bold; cursor: pointer;
    padding: 6px 8px; border-radius: 8px;
    border: 2px solid var(--madeira); background: var(--papel-escuro); color: var(--texto);
  }
  .aba.ativa { background: var(--madeira); color: #fff8e7; }
  .aba .ponto {
    position: absolute; top: -5px; right: -5px; width: 12px; height: 12px;
    border-radius: 50%; background: #ff5a4f; border: 2px solid #fff8e7; display: none;
  }
  .aba .ponto.on { display: block; }

  .itens { padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 200px); overflow-y: auto; }
  .item {
    display: flex; align-items: center; gap: 10px; text-align: left;
    width: 100%; font: inherit; color: inherit; cursor: pointer;
    background: #fffdf5; border: 3px solid var(--madeira); border-radius: 10px;
    padding: 8px 10px; box-shadow: 0 3px 0 var(--madeira-escura);
    transition: transform .08s, background .15s;
  }
  .item:hover:not(.bloqueado):not(.feito):not(.caro) { background: #f2ffe6; transform: translateY(-1px); }
  .item:active:not(.bloqueado):not(.feito):not(.caro) { transform: translateY(2px); box-shadow: 0 1px 0 var(--madeira-escura); }
  .item .ico { font-size: 30px; width: 40px; text-align: center; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .nome { font-weight: bold; font-size: 15px; }
  .item .qtd {
    display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 6px;
    background: var(--verde); color: #fff; font-size: 12px; vertical-align: middle;
  }
  .item .desc { font-size: 12px; opacity: .85; margin-top: 2px; }
  .item .efeito { font-size: 12px; color: var(--verde-escuro); font-weight: bold; margin-top: 2px; }
  .item .preco {
    font-weight: bold; white-space: nowrap; font-size: 14px;
    background: #fff1b8; border: 2px solid #c99a2e; border-radius: 8px; padding: 2px 6px;
  }
  .item.caro { cursor: not-allowed; }
  .item.caro .preco { background: #f3e2df; border-color: #c98a80; color: #a0453a; }
  .item.bloqueado { cursor: not-allowed; background: #ece3cf; filter: grayscale(.7); opacity: .8; }
  .item.bloqueado .preco { background: #ddd; border-color: #999; }
  .item.feito { cursor: default; background: #e7f6dc; border-color: var(--verde-escuro); box-shadow: 0 3px 0 #2c5e1c; }
  .item.feito .preco { background: var(--verde); border-color: var(--verde-escuro); color: #fff; }
  .item.misterio .ico { filter: brightness(0); opacity: .35; }
  .vazio { text-align: center; padding: 10px; font-weight: bold; opacity: .8; }
  .concluidos { border: 3px dashed var(--madeira); border-radius: 10px; background: var(--papel-escuro); }
  .concluidos summary {
    cursor: pointer; padding: 8px 12px; font-weight: bold; list-style: none; user-select: none;
  }
  .concluidos summary::-webkit-details-marker { display: none; }
  .concluidos summary::before { content: '▶ '; font-size: 11px; }
  .concluidos[open] summary::before { content: '▼ '; }
  .lista-concluidos { display: flex; flex-direction: column; gap: 6px; padding: 0 8px 8px; }
  .lista-concluidos .item { padding: 4px 8px; box-shadow: none; }
  .lista-concluidos .item .ico { font-size: 20px; width: 28px; }
  .lista-concluidos .item .desc, .lista-concluidos .item .efeito { display: none; }

  /* Contadores de animais sobre a fazenda */
  .rotulos { position: absolute; inset: 8px; pointer-events: none; }
  .grupo-rotulos { position: absolute; transform: translate(-50%, -50%); display: flex; gap: 3px; }
  .rotulo-animal {
    background: rgba(255, 248, 231, .92); color: var(--texto);
    border: 2px solid var(--madeira-escura); border-radius: 8px;
    padding: 0 5px; font-size: clamp(10px, 1.3vw, 14px); font-weight: bold; white-space: nowrap;
    box-shadow: 0 2px 0 var(--madeira-escura);
  }

  /* ---------- Avisos e modal ---------- */
  #avisos {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 50;
    pointer-events: none; width: min(92vw, 520px);
  }
  .aviso {
    background: var(--papel); border: 3px solid var(--madeira); border-radius: 10px;
    padding: 8px 14px; font-weight: bold; text-align: center;
    box-shadow: 0 3px 0 var(--madeira-escura);
    animation: aparece .3s ease-out, some .5s ease-in 3.2s forwards;
  }
  .aviso.grande { background: #fff1b8; font-size: 17px; }
  @keyframes aparece { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes some { to { opacity: 0; transform: translateY(8px); } }

  #modal {
    position: fixed; inset: 0; background: rgba(40, 25, 10, .55);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  #modal.aberto { display: flex; }
  #modal .caixa { max-width: 380px; padding: 20px; text-align: center; }
  #modal h2 { margin: 0 0 8px; }
  #modal .botoes { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

  @media (max-width: 900px) {
    main { flex-direction: column; padding: 10px; }
    .loja-col { max-width: none; width: 100%; min-width: 0; }
    .itens { max-height: none; }
    header { padding: 8px 10px; }
    header h1 { font-size: 17px; }
    .stat.moedas { font-size: 17px; min-width: 0; }
    .btn { padding: 4px 8px; font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌻 Fazendinha Renascida</h1>
  <div class="stats">
    <div class="stat moedas">🪙 <span id="moedas">0</span></div>
    <div class="stat">👆 <span id="porClique">1</span> <small>por clique</small></div>
    <div class="stat">⏱️ <span id="porSegundo">0</span> <small>por segundo</small></div>
  </div>
  <div class="botoes-topo">
    <button class="btn" id="btnMusica" title="Ligar/desligar a música">🎵 <span class="rotulo-som">Música</span></button>
    <button class="btn" id="btnEfeitos" title="Ligar/desligar os efeitos sonoros">🔊 <span class="rotulo-som">Efeitos</span></button>
    <button class="btn perigo" id="btnReiniciar">🔄 Reiniciar</button>
  </div>
</header>

<main>
  <section class="fazenda-col painel">
    <div class="fazenda-wrap" id="fazendaWrap">
      <canvas id="fazenda" width="400" height="260"></canvas>
      <div class="rotulos" id="rotulos"></div>
    </div>
    <div class="dica" id="dica">👆 Clique na fazenda para ganhar moedas e começar a reconstrução!</div>
    <div class="progresso">
      <div class="rotulo"><span>🏡 Reconstrução da fazenda</span><span id="progTxt">0%</span></div>
      <div class="barra"><div id="progBarra"></div></div>
    </div>
  </section>

  <section class="loja-col painel">
    <h2 class="loja-titulo">🛒 Loja</h2>
    <div class="abas" id="abas"></div>
    <div class="itens" id="itens"></div>
  </section>
</main>

<div id="avisos"></div>

<div id="modal">
  <div class="caixa painel">
    <h2>🔄 Reiniciar o jogo?</h2>
    <p>Todo o progresso será perdido e a fazenda voltará a ficar abandonada. Tem certeza?</p>
    <div class="botoes">
      <button class="btn" id="btnCancelar">Cancelar</button>
      <button class="btn perigo" id="btnConfirmar">Sim, recomeçar</button>
    </div>
  </div>
</div>

<script>

const ITEM = Object.fromEntries(ITENS.map(i => [i.id, i]));
const CRESCIMENTO = 1.15; // cada compra de item repetível fica 15% mais cara

// =====================================================================
// ESTADO E SALVAMENTO
// =====================================================================
const CHAVE_SAVE = 'fazendinha-renascida-v1';
const CHAVE_CONFIG = 'fazendinha-renascida-config';
const novoEstado = () => ({ moedas: 0, itens: {}, cliques: 0, salvoEm: Date.now() });
let estado = novoEstado();
let config = { musica: true, efeitos: true };

function carregar() {
  try {
    const bruto = localStorage.getItem(CHAVE_SAVE);
    if (bruto) {
      estado = Object.assign(novoEstado(), JSON.parse(bruto));
      estado.itens = estado.itens || {};
    }
  } catch (e) { estado = novoEstado(); }
  try { Object.assign(config, JSON.parse(localStorage.getItem(CHAVE_CONFIG) || '{}')); } catch (e) {}
  migrarSave();
}
// Saves antigos: se o jogador já tem um item cujos novos requisitos
// (ex.: galinheiro, ponte) ainda não existiam, libera esses requisitos.
function migrarSave() {
  let mudou = true;
  while (mudou) {
    mudou = false;
    for (const item of ITENS) {
      if (!qtd(item.id) || !item.req) continue;
      for (const [id, n] of item.req) {
        if (ITEM[id].unico && qtd(id) < n) { estado.itens[id] = n; mudou = true; }
      }
    }
  }
}
function salvar() {
  estado.salvoEm = Date.now();
  try { localStorage.setItem(CHAVE_SAVE, JSON.stringify(estado)); } catch (e) {}
}
function salvarConfig() {
  try { localStorage.setItem(CHAVE_CONFIG, JSON.stringify(config)); } catch (e) {}
}

const qtd = id => estado.itens[id] || 0;
const tem = id => qtd(id) > 0;

function custoDe(item) {
  return item.unico ? item.custo : Math.floor(item.custo * Math.pow(CRESCIMENTO, qtd(item.id)));
}
function liberado(item) {
  return !item.req || item.req.every(([id, n]) => qtd(id) >= n);
}
function visivel(item) {
  return !item.req || item.req.every(([id]) => liberado(ITEM[id]));
}
function multiplicador(campo) {
  let m = 1;
  for (const it of ITENS) if (it[campo] && tem(it.id)) m *= it[campo];
  return m;
}
function moedasPorSegundo() {
  const mp = multiplicador('multPlantas'), ma = multiplicador('multAnimais'), mtm = multiplicador('multTrigoMilho');
  let total = 0;
  for (const it of ITENS) {
    if (!it.porSeg) continue;
    let v = it.porSeg * qtd(it.id);
    if (it.cat === 'plantacoes') v *= mp;
    if (it.id === 'trigo' || it.id === 'milho') v *= mtm;
    if (it.cat === 'animais') v *= ma;
    total += v;
  }
  return total;
}
function moedasPorClique() {
  let base = 1, pct = 0;
  for (const it of ITENS) {
    if (it.clique) base += it.clique * qtd(it.id);
    if (it.cliquePct && tem(it.id)) pct += it.cliquePct;
  }
  return Math.floor(base * multiplicador('multClique') + moedasPorSegundo() * pct);
}

function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1e6) return Math.floor(n).toLocaleString('pt-BR');
  if (n >= 1e36) return n.toExponential(2).replace('.', ',').replace('e+', 'e');
  const unidades = [[1e33, 'dec'], [1e30, 'non'], [1e27, 'oct'], [1e24, 'sept'], [1e21, 'sext'], [1e18, 'quint'],
    [1e15, 'quatri'], [1e12, 'tri'], [1e9, 'bi'], [1e6, 'mi']];
  for (const [v, s] of unidades) {
    if (n >= v) return (n / v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + s;
  }
}
function fmtTaxa(n) {
  if (n < 1000 && n % 1 !== 0) return n.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  return fmt(n);
}

const Som = {
  ctx: null, sfx: null, mus: null, eco: null, ruidoBuf: null,

  iniciar() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.connect(ctx.destination);
    const master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
    this.sfx = ctx.createGain(); this.sfx.gain.value = config.efeitos ? 0.6 : 0; this.sfx.connect(master);
    this.mus = ctx.createGain(); this.mus.gain.value = config.musica ? 0.5 : 0; this.mus.connect(master);
    // eco suave para a melodia
    this.eco = ctx.createDelay(1); this.eco.delayTime.value = Musica.passo * 1.5;
    const retorno = ctx.createGain(); retorno.gain.value = 0.3;
    const filtro = ctx.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = 2200;
    const molhado = ctx.createGain(); molhado.gain.value = 0.35;
    this.eco.connect(filtro); filtro.connect(retorno); retorno.connect(this.eco);
    filtro.connect(molhado); molhado.connect(this.mus);
    // ruído branco reaproveitável
    this.ruidoBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = this.ruidoBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (config.musica) Musica.iniciar();
  },

  ajustar() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.sfx.gain.setTargetAtTime(config.efeitos ? 0.6 : 0, t, 0.05);
    this.mus.gain.setTargetAtTime(config.musica ? 0.5 : 0, t, 0.3);
    if (config.musica) Musica.iniciar(); else Musica.parar();
  },

  // Um tom com envelope. Opções: tipo, vol, ataque, ate (frequência final),
  // destino, filtro {tipo, freq, q}, vibrato {taxa, prof}, eco
  tom(freq, quando, dur, o = {}) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = o.tipo || 'sine';
    osc.frequency.setValueAtTime(freq, quando);
    if (o.ate) osc.frequency.exponentialRampToValueAtTime(o.ate, quando + dur);
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();
    const ataque = o.ataque || 0.005, vol = o.vol || 0.2;
    g.gain.setValueAtTime(0.0001, quando);
    g.gain.linearRampToValueAtTime(vol, quando + ataque);
    g.gain.exponentialRampToValueAtTime(0.0001, quando + dur);
    let saida = g;
    osc.connect(g);
    if (o.filtro) {
      const f = ctx.createBiquadFilter();
      f.type = o.filtro.tipo; f.frequency.value = o.filtro.freq; f.Q.value = o.filtro.q || 1;
      g.connect(f); saida = f;
    }
    if (o.vibrato) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = o.vibrato.taxa; lg.gain.value = o.vibrato.prof;
      lfo.connect(lg); lg.connect(osc.frequency);
      lfo.start(quando); lfo.stop(quando + dur + 0.05);
    }
    saida.connect(o.destino || this.sfx);
    if (o.eco) saida.connect(this.eco);
    osc.start(quando); osc.stop(quando + dur + 0.05);
  },

  ruido(quando, dur, o = {}) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.ruidoBuf;
    const f = ctx.createBiquadFilter();
    f.type = o.filtro || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, quando); f.Q.value = o.q || 1;
    if (o.ate) f.frequency.exponentialRampToValueAtTime(o.ate, quando + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, quando);
    g.gain.linearRampToValueAtTime(o.vol || 0.2, quando + (o.ataque || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, quando + dur);
    src.connect(f); f.connect(g); g.connect(o.destino || this.sfx);
    src.start(quando, Math.random() * 0.5); src.stop(quando + dur + 0.05);
  },

  pronto(tipo) { return this.ctx && this.ctx.state === 'running' && (tipo === 'musica' ? config.musica : config.efeitos); },

  // ---------- efeitos ----------
  clique() {
    if (!this.pronto()) return;
    const t = this.ctx.currentTime, f = 600 + Math.random() * 160;
    this.tom(f, t, 0.09, { tipo: 'triangle', vol: 0.12, ate: f * 1.6 });

  },
  compra() {
    if (!this.pronto()) return;
    const t = this.ctx.currentTime;
    [1046.5, 1318.5, 1568].forEach((f, i) => {
      this.tom(f, t + i * 0.07, 0.35, { vol: 0.12 });

  },
  limpeza() {
    if (!this.pronto()) return;
    const t = this.ctx.currentTime;
    this.ruido(t, 0.45, { freq: 600, ate: 3500, q: 1.2, vol: 0.25, ataque: 0.05 });
    this.ruido(t + 0.15, 0.35, { freq: 2500, ate: 900, q: 1.5, vol: 0.15, ataque: 0.04 });
    [1318.5, 1568, 2093].forEach((f, i) => this.tom(f, t + 0.3 + i * 0.06, 0.4, { vol: 0.09 }));
  },
  fanfarra() {
    if (!this.pronto()) return;
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      this.tom(f, t + i * 0.12, 0.5, { tipo: 'triangle', vol: 0.14 });
      this.tom(f / 2, t + i * 0.12, 0.5, { vol: 0.06 });
    });
    this.tom(1318.5, t + 0.5, 0.9, { vol: 0.1 });
    this.tom(1046.5, t + 0.5, 0.9, { tipo: 'triangle', vol: 0.08 });
  },
  erro() {
    if (!this.pronto()) return;
    const t = this.ctx.currentTime;
    this.tom(240, t, 0.16, { tipo: 'square', vol: 0.05, ate: 170, filtro: { tipo: 'lowpass', freq: 1200 } });
  },
  passarinho(vol = 0.05) {
    if (!this.pronto()) return;
    const t = this.ctx.currentTime, base = 2600 + Math.random() * 900, n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) this.tom(base, t + i * 0.11, 0.08, { vol, ate: base * 1.35 });
  },
  animal(tipo, vol = 1) {
    if (!this.pronto()) return;
    const t = this.ctx.currentTime;
    if (tipo === 'galinha') {
      for (let i = 0; i < 3; i++) this.tom(700 + Math.random() * 80, t + i * 0.1, 0.07, { tipo: 'sawtooth', vol: 0.08 * vol, ate: 950, filtro: { tipo: 'bandpass', freq: 1400, q: 2 } });
      this.tom(650, t + 0.32, 0.22, { tipo: 'sawtooth', vol: 0.09 * vol, ate: 900, filtro: { tipo: 'bandpass', freq: 1300, q: 2 } });
    } else if (tipo === 'pato') {
      for (let i = 0; i < 2; i++) this.tom(420, t + i * 0.2, 0.15, { tipo: 'sawtooth', vol: 0.14 * vol, ate: 260, filtro: { tipo: 'bandpass', freq: 1100, q: 3 } });
    } else if (tipo === 'porco') {

      this.tom(470, t, 0.6, { tipo: 'sawtooth', vol: 0.1 * vol, ate: 430, vibrato: { taxa: 16, prof: 28 }, filtro: { tipo: 'bandpass', freq: 1500, q: 1.5 }, ataque: 0.04 });
    } else if (tipo === 'vaca') {
      this.tom(150, t, 1.1, { tipo: 'sawtooth', vol: 0.16 * vol, ate: 105, filtro: { tipo: 'lowpass', freq: 650 }, ataque: 0.15, vibrato: { taxa: 4, prof: 3 } });
    }
  },
};

// ---------- Música de fundo gerada (lo-fi aconchegante) ----------
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Musica = {
  passo: 60 / 76 / 2,        // colcheia a 76 BPM
  tocando: false, n: 0, proximo: 0, timer: null, nota: 3,
  acordes: [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]], // Fmaj7 Em7 Dm7 Cmaj7
  escala: [67, 69, 72, 74, 76, 79, 81, 84],

  iniciar() {
    if (!Som.ctx || this.tocando) return;
    this.tocando = true;
    this.proximo = Som.ctx.currentTime + 0.15;
    this.timer = setInterval(() => this.agendar(), 100);
  },
  parar() { this.tocando = false; clearInterval(this.timer); },
  agendar() {
    const ctx = Som.ctx;
    if (ctx.state !== 'running') return;
    if (this.proximo < ctx.currentTime - 0.1) this.proximo = ctx.currentTime + 0.05;
    while (this.proximo < ctx.currentTime + 0.4) {
      this.tocarPasso(this.n, this.proximo);
      this.proximo += this.passo; this.n++;
    }
  },
  tocarPasso(n, t) {
    const compasso = Math.floor(n / 8), dentro = n % 8;
    const acorde = this.acordes[compasso % 4];
    const dest = Som.mus;
    if (dentro === 0) {
      for (const nt of acorde) {
        Som.tom(midi(nt), t, this.passo * 8.6, { vol: 0.03, ataque: 0.7, destino: dest });
        Som.tom(midi(nt + 12), t, this.passo * 8.6, { vol: 0.008, ataque: 0.9, detune: 7, tipo: 'triangle', destino: dest });
      }
    }
    if (dentro === 0 || dentro === 4) {
      const nt = (dentro === 0 ? acorde[0] : acorde[2]) - 12;
      Som.tom(midi(nt), t, this.passo * 3.6, { tipo: 'triangle', vol: 0.1, ataque: 0.02, destino: dest });
    }
    if (dentro % 2 === 1) Som.ruido(t, 0.05, { filtro: 'highpass', freq: 7000, vol: 0.012, destino: dest });

    // melodia de caixinha de música (passeio aleatório na escala pentatônica)
    const frase = Math.floor(compasso / 4) % 4;
    let prob = dentro % 2 === 0 ? 0.55 : 0.2;
    if (frase === 3) prob *= 0.4;
    if (Math.random() < prob) {
      if (dentro === 0) {
        // começa o compasso perto de uma nota do acorde
        const alvo = acorde[1 + Math.floor(Math.random() * 3)] + 12;
        this.nota = this.escala.reduce((m, v, i) => Math.abs(v - alvo) < Math.abs(this.escala[m] - alvo) ? i : m, 0);
      } else {
        this.nota = Math.max(0, Math.min(this.escala.length - 1, this.nota + Math.floor(Math.random() * 5) - 2));
      }
      const f = midi(this.escala[this.nota]);
      Som.tom(f, t, 1.3, { vol: 0.055, destino: dest, eco: true });
      Som.tom(f * 2, t, 0.35, { vol: 0.012, destino: dest });
    }
  },
};

const W = 400, H = 260;
const canvas = document.getElementById('fazenda');
const tela = canvas.getContext('2d');
tela.imageSmoothingEnabled = false;
let c = tela; // contexto atual (troca para desenhar nos caches)

function novoCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
function comCtx(ctx, fn) { const antigo = c; c = ctx; fn(); c = antigo; }
function R(x, y, w, h, cor) { c.fillStyle = cor; c.fillRect(Math.round(x), Math.round(y), w, h); }
function circulo(cx, cy, r, cor) {
  c.fillStyle = cor;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5);
    c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function elipse(cx, cy, rx, ry, cor) {
  c.fillStyle = cor;
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.round(rx * Math.sqrt(1 - (dy / ry) * (dy / ry)));
    c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function sombra(cx, cy, rx, ry) { elipse(cx, cy, rx, ry, 'rgba(30,40,10,.22)'); }

function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function ruido(x, y, escala, semente = 0) {
  const fx = x / escala, fy = y / escala, x0 = Math.floor(fx), y0 = Math.floor(fy);
  const sx = fx - x0, sy = fy - y0, s = t => t * t * (3 - 2 * t);
  const a = hash2(x0 + semente, y0), b = hash2(x0 + 1 + semente, y0);
  const c2 = hash2(x0 + semente, y0 + 1), d = hash2(x0 + 1 + semente, y0 + 1);
  const top = a + (b - a) * s(sx), bot = c2 + (d - c2) * s(sx);
  return top + (bot - top) * s(sy);
}
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

// Gerador aleatório com semente (o cenário fica sempre igual)
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = rng(20240607);
const entre = (a, b) => a + rnd() * (b - a);
const entreI = (a, b) => Math.round(entre(a, b));

// Sprites a partir de "desenhos" em texto, com contorno automático
function criarSprite(linhas, paleta, contorno) {
  const h = linhas.length, w = Math.max(...linhas.map(l => l.length));
  const cv = novoCanvas(w + 2, h + 2), x = cv.getContext('2d');
  const cheio = (i, j) => j >= 0 && j < h && i >= 0 && i < (linhas[j] || '').length && paleta[linhas[j][i]];
  if (contorno) {
    x.fillStyle = contorno;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (cheio(i, j)) continue;
      if (cheio(i - 1, j) || cheio(i + 1, j) || cheio(i, j - 1) || cheio(i, j + 1)) x.fillRect(i + 1, j + 1, 1, 1);
    }
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < linhas[j].length; i++) {
    const cor = paleta[linhas[j][i]];
    if (cor) { x.fillStyle = cor; x.fillRect(i + 1, j + 1, 1, 1); }
  }
  return cv;
}
function espelhar(cv) {
  const e = novoCanvas(cv.width, cv.height), x = e.getContext('2d');
  x.translate(cv.width, 0); x.scale(-1, 1); x.drawImage(cv, 0, 0);
  return e;
}
function conjunto(quadros, paleta, contorno) {
  const r = {};
  for (const k in quadros) { const d = criarSprite(quadros[k], paleta, contorno); r[k] = { d, e: espelhar(d) }; }
  return r;
}

function gerar(n, x1, x2, y1, y2, filtro, fn) {
  const lista = [];
  let tent = 0;
  while (lista.length < n && tent++ < n * 30) {
    const x = entreI(x1, x2), y = entreI(y1, y2);
    if (!filtro || filtro(x, y)) lista.push(fn(x, y));
  }
  return lista;
}

const GRAMA = ['#4f8f3a', '#5a9e3f', '#66ad45', '#72ba4c', '#82c657'].map(rgb);
const SECA  = ['#6c6538', '#787040', '#837a46', '#8e844d', '#9a8f56'].map(rgb);
const sombraGrama = (() => {
  const s = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = ruido(x, y, 18) * 0.55 + ruido(x, y, 6, 50) * 0.3 + hash2(x, y) * 0.15;
    s[y * W + x] = Math.max(0, Math.min(4, Math.floor(v * 5.2 - 0.3)));
  }
  // folhinhas de grama: um pixel claro com um escuro embaixo
  for (let y = 1; y < H - 1; y++) for (let x = 0; x < W; x++) {
    const h = hash2(x * 7 + 3, y * 13 + 1);
    if (h > 0.955) { s[y * W + x] = Math.min(4, s[y * W + x] + 2); s[(y + 1) * W + x] = Math.max(0, s[(y + 1) * W + x] - 1); }
    else if (h < 0.025) s[y * W + x] = Math.max(0, s[y * W + x] - 2);
  }
  return s;
})();

function nivelCentro() { return ['mato', 'pedras', 'lixo', 'cerca'].filter(tem).length; }
function sujeiraZona(z) {
  if (z === 'centro') return 1 - nivelCentro() / 4;
  if (z === 'oeste') return tem('ponte') ? Math.max(0, 0.75 - 0.25 * ['entulho', 'lago', 'estufa'].filter(tem).length) : 0.9;
  return tem('mata') ? 0 : 0.5;
}

const cacheChao = novoCanvas(W, H);
const cacheTopo = novoCanvas(W, H);

function desenharGramaBase() {
  const ctx = cacheChao.getContext('2d');
  const img = ctx.createImageData(W, H), d = img.data;
  const suj = { oeste: sujeiraZona('oeste'), centro: sujeiraZona('centro'), leste: sujeiraZona('leste') };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, s = sombraGrama[i], k = suj[zona(x)] * 0.85;
    const g = GRAMA[s], sc = SECA[s];
    d[i * 4] = g[0] + (sc[0] - g[0]) * k;
    d[i * 4 + 1] = g[1] + (sc[1] - g[1]) * k;
    d[i * 4 + 2] = g[2] + (sc[2] - g[2]) * k;
    d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function caminho(x, y, w, h, gasto) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const px = x + i, py = y + j, hh = hash2(px * 3, py * 5);
    if (gasto && hash2(px, py * 2) < gasto) continue; // grama tomando conta
    let cor = hh < 0.15 ? '#c39c62' : hh > 0.9 ? '#e0bf8a' : '#d4b07a';
    if (hh > 0.985) cor = '#a8875a';
    R(px, py, 1, 1, cor);
  }
}

function canteiroTerra(x, y, w, h) {
  R(x, y + 1, w, h - 1, '#5c3a20');
  R(x, y, w, h - 1, '#77492a');
  for (let j = 2; j < h - 1; j += 3) R(x + 1, y + j, w - 2, 1, '#653e22');
  for (let i = 0; i < w; i += 3) if (hash2(x + i, y) > 0.5) R(x + i, y + 1 + (i % 5), 1, 1, '#8d5c38');
  R(x, y, w, 1, '#8d5c38');
}

// ---------- Cercas ----------
function cercaH(x0, x1, y, ok, buracos = []) {
  const cor = ok ? '#d39b5c' : '#8c7d69', cl = ok ? '#f0c58a' : '#a8998a', esc = ok ? '#8f5f30' : '#5f5446';
  for (let x = x0; x < x1; x += 8) {
    if (buracos.some(([a, b]) => x + 8 > a && x < b)) continue;
    const h = hash2(x, y * 7), falta = !ok && h < 0.2, torto = !ok && h > 0.72;
    if (!falta && x + 8 <= x1) {
      R(x + 2, y + 2, 7, 1, cl); R(x + 2, y + 3, 7, 1, esc);
      if (!torto) { R(x + 2, y + 6, 7, 1, cl); R(x + 2, y + 7, 7, 1, esc); }
      else R(x + 4, y + 7, 5, 1, esc);
    }
    if (!(falta && h < 0.08)) {
      const t = torto ? 1 : 0;
      R(x + t, y - 1 + t, 3, 10 - t, esc);
      R(x + t, y - 1 + t, 2, 9 - t, cor); R(x + t, y - 1 + t, 2, 1, cl);
    }
  }
}
function cercaV(x, y0, y1, ok, buracos = []) {
  const cor = ok ? '#d39b5c' : '#8c7d69', cl = ok ? '#f0c58a' : '#a8998a', esc = ok ? '#8f5f30' : '#5f5446';
  for (let y = y0; y < y1; y += 8) {
    if (buracos.some(([a, b]) => y + 8 > a && y < b)) continue;
    const h = hash2(x * 5, y), falta = !ok && h < 0.2, torto = !ok && h > 0.75;
    if (!falta && y + 8 <= y1) { R(x + 1, y + 2, 1, 8, cl); R(x + 2, y + 2, 1, 8, esc); }
    const t = torto ? 1 : 0;
    R(x - 1 + t, y + 1, 4, 4, esc); R(x - 1 + t, y, 4, 3, cor); R(x + t, y, 2, 1, cl);
  }
}

function telhado(cx, yTopo, linhas, larguraTopo, cores, borda) {
  for (let i = 0; i < linhas; i++) {
    const w = larguraTopo + i * 2;
    R(cx - w / 2, yTopo + i, w, 1, cores[i % cores.length]);
    if (i % 2 === 0) for (let k = (i % 4 ? 2 : 0); k < w; k += 4) R(cx - w / 2 + k, yTopo + i, 1, 1, borda);
  }
  const wb = larguraTopo + (linhas - 1) * 2;
  R(cx - wb / 2, yTopo + linhas - 1, wb, 1, borda);
}

let animais = [];
const LIMITES = { galinha: 10, pato: 8, porco: 6, ovelha: 7, vaca: 6 };
const VELOCIDADE = { galinha: 11, pato: 5, porco: 5, ovelha: 5, vaca: 4 };
const sorteia = (a, b) => a + Math.random() * (b - a);

function posicaoAleatoria(tipo) {
  if (tipo === 'pato') {
    for (;;) {
      const x = sorteia(LAGO.cx - LAGO.rx, LAGO.cx + LAGO.rx), y = sorteia(LAGO.cy - LAGO.ry, LAGO.cy + LAGO.ry);
      if (dentroLago(x, y, -9)) return [x, y];
    }
  }
  const a = tipo === 'galinha' ? AREAS.galinhas : AREAS.pasto;
  return [sorteia(a.x1, a.x2), sorteia(a.y1, a.y2)];
}
function sincronizarAnimais() {
  for (const tipo of Object.keys(LIMITES)) {
    const desejado = Math.min(LIMITES[tipo], qtd(tipo));
    const atuais = animais.filter(a => a.tipo === tipo);
    for (let i = atuais.length; i < desejado; i++) {
      const [x, y] = posicaoAleatoria(tipo), [tx, ty] = posicaoAleatoria(tipo);
      const variantes = SPR[tipo].length;
      animais.push({ tipo, x, y, tx, ty, dir: Math.random() < 0.5 ? 1 : -1, espera: Math.random() * 3, fase: Math.random() * 10, v: i % variantes, pulo: 0 });
    }
    if (atuais.length > desejado) {
      const sobram = new Set(atuais.slice(desejado));
      animais = animais.filter(a => !sobram.has(a));
    }
  }
}
function atualizarAnimais(dt) {
  for (const a of animais) {
    if (a.pulo > 0) a.pulo = Math.max(0, a.pulo - dt * 4);
    if (a.espera > 0) {
      a.espera -= dt;
      if (a.tipo === 'galinha' && Math.random() < dt * 0.3) a.pulo = 1;
      continue;
    }
    const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
    const v = VELOCIDADE[a.tipo] * dt;
    if (d <= v) {
      a.x = a.tx; a.y = a.ty;
      a.espera = 1 + Math.random() * (a.tipo === 'galinha' ? 2.5 : 5);
      [a.tx, a.ty] = posicaoAleatoria(a.tipo);
    } else {
      a.x += dx / d * v; a.y += dy / d * v;
      if (Math.abs(dx) > 0.5) a.dir = dx > 0 ? 1 : -1;
    }
  }
}
function desenharAnimal(a, t) {
  const spr = SPR[a.tipo][a.v];
  const andando = a.espera <= 0;
  let q = 'A';
  if (andando) q = (Math.floor(t / 160 + a.fase) % 2) ? 'B' : 'A';
  else if (spr.C && Math.sin(t / (a.tipo === 'galinha' ? 140 : 900) + a.fase) > 0.2) q = 'C';
  const quadro = (spr[q] || spr.A)[a.dir > 0 ? 'd' : 'e'];
  const w = quadro.width, h = quadro.height;
  const x = Math.round(a.x - w / 2);
  let y = Math.round(a.y - h);
  if (a.tipo === 'pato') {
    y += Math.round(Math.sin(t / 400 + a.fase));
    c.drawImage(quadro, x, y + 1);
    const p = tem('lago') ? AGUA.limpa : AGUA.suja;
    R(x + 1, Math.round(a.y) - 1, w - 2, 2, p.base);
    R(x, Math.round(a.y) - 1, 2, 1, p.espuma); R(x + w - 2, Math.round(a.y) - 1, 2, 1, p.espuma);
    return;
  }
  y -= Math.round(Math.sin(a.pulo * Math.PI) * 3);
  elipse(Math.round(a.x), Math.round(a.y), Math.round(w / 2) - 1, 1, 'rgba(30,40,10,.25)');
  c.drawImage(quadro, x, y);
}

let particulas = [];
function poeira(x, y, cores, n = 6, forca = 30, sobe = 15) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, v = Math.random() * forca;
    particulas.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - sobe, vida: 0.5 + Math.random() * 0.6, cor: cores[Math.floor(Math.random() * cores.length)], g: 60 });
  }
}
function coracao(x, y) { particulas.push({ x, y, vx: 0, vy: -14, vida: 1.2, cor: 'coracao', g: 0 }); }
function atualizarParticulas(dt) {
  for (const p of particulas) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vida -= dt; }
  particulas = particulas.filter(p => p.vida > 0);
  if (particulas.length > 900) particulas.splice(0, particulas.length - 900);
}
function desenharParticulas() {
  for (const p of particulas) {
    c.globalAlpha = Math.min(1, p.vida * 2);
    if (p.cor === 'coracao') {
      R(p.x - 2, p.y, 2, 1, '#ff5a7a'); R(p.x + 1, p.y, 2, 1, '#ff5a7a'); R(p.x - 2, p.y + 1, 5, 1, '#ff5a7a'); R(p.x - 1, p.y + 2, 3, 1, '#ff5a7a'); R(p.x, p.y + 3, 1, 1, '#ff5a7a');
      R(p.x - 1, p.y, 1, 1, '#ffb3c3');
    } else R(p.x, p.y, 1, 1, p.cor);

  c.globalAlpha = 1;
}

  for (const a of animais) if (a.tipo === 'pato') desenharAnimal(a, t);
  taboas(t);
  c.drawImage(cacheTopo, 0, 0);
  desenharCenouras(t);
  desenharTrigo(t);
  desenharAboboras(t);
  desenharMilho(t);
  desenharPomar(t);
  desenharPas(t);
  animais.filter(a => a.tipo !== 'pato').sort((a, b) => a.y - b.y).forEach(a => desenharAnimal(a, t));
  fumaca(t);
  borboletas(t);
  abelhas(t);
  nuvens(t);
  desenharParticulas();
}

// Onde cada compra "acontece" na fazenda (efeitos de poeira/brilho)
function efeitoCompra(item) {
  const brilho = ['#ffe066', '#ffffff', '#ffd93d'];
  const em = (lista, cores, n) => lista.forEach(o => poeira(o.x, o.y - 3, cores, n));
  switch (item.id) {
    case 'mato': return em(CENARIO.mato, ['#4d6a28', '#6f8f34', '#a7c957'], 3);
    case 'pedras': return em(CENARIO.pedras, ['#8d8d8d', '#bdbdbd', '#d9c9a3'], 5);
    case 'lixo': return em([...CENARIO.lixo, ...CENARIO.galhos], ['#b0b7bf', '#f2efe6', '#6b4a2f', '#d9c9a3'], 4);
    case 'entulho': return em([...CENARIO.entulho, ...CENARIO.matoOeste], ['#b5543c', '#9a7048', '#8d8d8d', '#d9c9a3'], 4);
    case 'lago': return em(CENARIO.lixoLago.concat(CENARIO.algas), ['#e0f6ff', '#8fd0f5', '#ffffff'], 8);
    case 'cerca':
      for (let x = 6; x < 396; x += 16) { poeira(x, 6, ['#f0c58a', '#ffd93d'], 2); poeira(x, 252, ['#f0c58a', '#ffd93d'], 2); }
      for (let y = 10; y < 250; y += 16) { poeira(4, y, ['#f0c58a'], 2); poeira(396, y, ['#f0c58a'], 2); }
      return;
    case 'mata':
      for (let i = 0; i < 70; i++) poeira(sorteia(290, 396), sorteia(10, 250), ['#2c5228', '#4d8040', '#6b4a2f', '#d9c9a3'], 3, 40);
      return;
  }
  const locais = {
    cenoura: [158, 90], trigo: [158, 150], abobora: [158, 192], milho: [250, 160], pomar: [52, 100], morango: [52, 48],
    galinha: [260, 96], pato: [50, 198], porco: [344, 170], ovelha: [344, 170], vaca: [344, 170],
    poco: [147, 44], espantalho: [140, 225], moinho: [258, 225], celeiro: [328, 40], colmeia: [378, 54], casa: [202, 40],
    galinheiro: [260, 45], ponte: [111, 124], estufa: [52, 36], trator: [224, 98],
  };
  const l = locais[item.id];
  if (l) poeira(l[0], l[1], item.cat === 'limpeza' ? ['#d9c9a3', '#ffffff', '#ffe066'] : brilho, 26, 50);
}

// =====================================================================
// INTERFACE
// =====================================================================
const $ = id => document.getElementById(id);
const elMoedas = $('moedas'), elClique = $('porClique'), elSeg = $('porSegundo');
const elAbas = $('abas'), elItens = $('itens'), wrap = $('fazendaWrap');
let abaAtual = 'limpeza';

function aviso(texto, grande) {
  const d = document.createElement('div');
  d.className = 'aviso' + (grande ? ' grande' : ''); d.textContent = texto;
  $('avisos').appendChild(d);
  setTimeout(() => d.remove(), 3800);
  while ($('avisos').children.length > 3) $('avisos').firstChild.remove();
}

function montarAbas() {
  elAbas.innerHTML = '';
  for (const cat of CATEGORIAS) {
    const b = document.createElement('button');
    b.className = 'aba' + (cat.id === abaAtual ? ' ativa' : '');
    b.dataset.cat = cat.id;
    b.innerHTML = `${cat.nome}<span class="ponto"></span>`;
    b.addEventListener('click', () => { abaAtual = cat.id; montarAbas(); montarLoja(); });
    elAbas.appendChild(b);
  }
}
function textoReq(item) {
  return item.req.filter(([id, n]) => qtd(id) < n)
    .map(([id, n]) => n > 1 ? `${n}× ${ITEM[id].nome}` : ITEM[id].nome).join(' + ');
}
function textoEfeito(item) {
  const partes = [];
  if (item.clique) partes.push(`+${fmt(item.clique)} por clique`);
  if (item.porSeg) partes.push(item.unico ? `+${fmt(item.porSeg)}/s` : `+${fmt(item.porSeg)}/s cada`);
  return partes.join(' · ');
}
// Ordem da lista: disponíveis no topo, depois bloqueados, depois mistérios;
// itens únicos já comprados vão para a seção recolhida "Concluídos".
let concluidosAberto = false;
function cartaoItem(item) {
  const b = document.createElement('button');
  b.className = 'item';
  b.dataset.id = item.id;
  const feito = item.unico && tem(item.id);
  const lib = liberado(item);
  if (!lib && !visivel(item)) {
    b.classList.add('bloqueado', 'misterio');
    b.innerHTML = `<div class="ico">${item.ico}</div>
      <div class="info"><div class="nome">???</div><div class="desc">Continue reconstruindo a fazenda para descobrir.</div></div>
      <div class="preco">🔒</div>`;
  } else if (!lib) {
    b.classList.add('bloqueado');
    b.innerHTML = `<div class="ico">${item.ico}</div>
      <div class="info"><div class="nome">${item.nome}</div><div class="desc">🔒 Requer: ${textoReq(item)}</div>
      <div class="efeito">${textoEfeito(item)}</div></div>
      <div class="preco">🔒</div>`;
  } else {
    if (feito) b.classList.add('feito');
    const q = !item.unico && qtd(item.id) ? `<span class="qtd">×${fmt(qtd(item.id))}</span>` : '';
    b.innerHTML = `<div class="ico">${item.ico}</div>
      <div class="info"><div class="nome">${item.nome}${q}</div><div class="desc">${item.desc}</div>
      <div class="efeito">${textoEfeito(item)}</div></div>
      <div class="preco">${feito ? '✔ Feito' : '🪙 ' + fmt(custoDe(item))}</div>`;
    if (!feito) b.addEventListener('click', () => comprar(item));
  }
  return b;
}
function montarLoja() {
  elItens.innerHTML = '';
  const itens = ITENS.filter(i => i.cat === abaAtual);
  const concluidos = itens.filter(i => i.unico && tem(i.id));
  const pendentes = itens.filter(i => !concluidos.includes(i));
  const grupo = i => liberado(i) ? 0 : visivel(i) ? 1 : 2;
  pendentes.sort((a, b) => grupo(a) - grupo(b)); // sort estável: mantém a ordem original dentro do grupo
  for (const item of pendentes) elItens.appendChild(cartaoItem(item));
  if (!pendentes.length) {
    const vazio = document.createElement('div');
    vazio.className = 'vazio';
    vazio.textContent = '🎉 Tudo desta categoria já foi feito!';
    elItens.appendChild(vazio);
  }
  if (concluidos.length) {
    const d = document.createElement('details');
    d.className = 'concluidos';
    d.open = concluidosAberto;
    d.addEventListener('toggle', () => { concluidosAberto = d.open; });
    d.innerHTML = `<summary>✔ Concluídos (${concluidos.length})</summary>`;
    const lista = document.createElement('div');
    lista.className = 'lista-concluidos';
    for (const item of concluidos) lista.appendChild(cartaoItem(item));
    d.appendChild(lista);
    elItens.appendChild(d);
  }
  atualizarLoja();
}
function atualizarLoja() {
  for (const b of elItens.querySelectorAll('.item')) {
    const item = ITEM[b.dataset.id];
    if (b.classList.contains('bloqueado') || b.classList.contains('feito')) continue;
    b.classList.toggle('caro', estado.moedas < custoDe(item));
  }
  for (const aba of elAbas.children) {
    const temCompra = ITENS.some(i => i.cat === aba.dataset.cat && liberado(i) && !(i.unico && tem(i.id)) && estado.moedas >= custoDe(i));
    aba.querySelector('.ponto').classList.toggle('on', temCompra);
  }
}
// Contadores com o total de cada animal (na tela aparecem no máximo LIMITES[tipo])
const GRUPOS_ROTULO = [
  { x: 258, y: 121, tipos: ['galinha'] },                // na frente do galinheiro
  { x: 50, y: 160, tipos: ['pato'] },                    // na margem do lago
  { x: 340, y: 81, tipos: ['porco', 'ovelha', 'vaca'] }, // no alto do pasto
];
function atualizarRotulos() {
  const el = $('rotulos');
  el.innerHTML = '';
  for (const g of GRUPOS_ROTULO) {
    const tipos = g.tipos.filter(tem);
    if (!tipos.length) continue;
    const grupo = document.createElement('div');
    grupo.className = 'grupo-rotulos';
    grupo.style.left = (g.x / W * 100) + '%';
    grupo.style.top = (g.y / H * 100) + '%';
    for (const tipo of tipos) {
      const r = document.createElement('div');
      r.className = 'rotulo-animal';
      r.textContent = `${ITEM[tipo].ico} ×${fmt(qtd(tipo))}`;
      r.title = `${ITEM[tipo].nome}: ${fmt(qtd(tipo))}`;
      grupo.appendChild(r);
    }
    el.appendChild(grupo);
  }
}
function atualizarHUD() {
  elMoedas.textContent = fmt(estado.moedas);
  elClique.textContent = fmt(moedasPorClique());
  elSeg.textContent = fmtTaxa(moedasPorSegundo());
}
function atualizarProgresso() {
  const unicos = ITENS.filter(i => i.unico);
  const pct = Math.round(unicos.filter(i => tem(i.id)).length / unicos.length * 100);
  $('progTxt').textContent = pct + '%';
  $('progBarra').style.width = pct + '%';
}

function comprar(item) {
  Som.iniciar();
  if (!liberado(item) || (item.unico && tem(item.id))) return;
  const custo = custoDe(item);
  if (estado.moedas < custo) { Som.erro(); aviso('Moedas insuficientes! 🪙'); return; }
  estado.moedas -= custo;
  estado.itens[item.id] = qtd(item.id) + 1;

  redesenharCaches();
  efeitoCompra(item);
  sincronizarAnimais();
  atualizarRotulos();
  if (item.grande) Som.fanfarra();
  else if (item.cat === 'limpeza') Som.limpeza();
  else Som.compra();
  if (item.som) setTimeout(() => Som.animal(item.som), 250);

  aviso(item.msg || `${item.nome} comprado!`, item.grande);
  montarLoja();
  atualizarHUD();
  atualizarProgresso();
  salvar();
}

// ---------- Clique na fazenda ----------
let ultimoSomAnimal = 0;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  Som.iniciar();
  const ganho = moedasPorClique();
  estado.moedas += ganho;
  estado.cliques++;

  const rc = canvas.getBoundingClientRect(), rw = wrap.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'flutua';
  f.textContent = '+' + fmt(ganho);
  f.style.left = (e.clientX - rw.left) + 'px';
  f.style.top = (e.clientY - rw.top) + 'px';
  wrap.appendChild(f);
  setTimeout(() => f.remove(), 900);

  const cx = (e.clientX - rc.left) / rc.width * W, cy = (e.clientY - rc.top) / rc.height * H;
  poeira(cx, cy, ['#ffe066', '#ffd93d', '#fff6b0'], 5, 35);

  // clicou num animal? ele responde!
  const alvo = animais.find(a => Math.abs(a.x - cx) < 8 && cy < a.y + 2 && cy > a.y - 14);
  if (alvo && performance.now() - ultimoSomAnimal > 350) {
    ultimoSomAnimal = performance.now();
    Som.animal(alvo.tipo);
    coracao(alvo.x, alvo.y - 16);
    if (alvo.tipo === 'galinha') alvo.pulo = 1;
  } else Som.clique();

  if (estado.cliques === 10) $('dica').textContent = '🛒 Use as moedas na loja para limpar e reconstruir a fazenda!';
  atualizarHUD();
});

// ---------- Botões de som ----------
function atualizarBotoesSom() {
  $('btnMusica').classList.toggle('desligado', !config.musica);
  $('btnEfeitos').classList.toggle('desligado', !config.efeitos);
  $('btnMusica').firstChild.textContent = config.musica ? '🎵 ' : '🔇 ';
  $('btnEfeitos').firstChild.textContent = config.efeitos ? '🔊 ' : '🔈 ';
}
$('btnMusica').addEventListener('click', () => {
  config.musica = !config.musica; salvarConfig(); Som.iniciar(); Som.ajustar(); atualizarBotoesSom();
});
$('btnEfeitos').addEventListener('click', () => {
  config.efeitos = !config.efeitos; salvarConfig(); Som.iniciar(); Som.ajustar(); atualizarBotoesSom();
  if (config.efeitos) Som.clique();
});
// o navegador só libera o áudio depois de uma interação
document.addEventListener('pointerdown', () => Som.iniciar());
document.addEventListener('keydown', () => Som.iniciar());

// ---------- Reiniciar ----------
$('btnReiniciar').addEventListener('click', () => $('modal').classList.add('aberto'));
$('btnCancelar').addEventListener('click', () => $('modal').classList.remove('aberto'));
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') $('modal').classList.remove('aberto'); });
$('btnConfirmar').addEventListener('click', () => {
  try { localStorage.removeItem(CHAVE_SAVE); } catch (e) {}
  estado = novoEstado();
  animais = []; particulas = [];
  abaAtual = 'limpeza';
  $('modal').classList.remove('aberto');
  $('dica').textContent = '👆 Clique na fazenda para ganhar moedas e começar a reconstrução!';
  redesenharCaches();
  montarAbas(); montarLoja(); atualizarHUD(); atualizarProgresso(); atualizarRotulos(); salvar();
  aviso('A fazenda voltou ao começo. Boa sorte! 🌱');
});

// =====================================================================
// LOOP PRINCIPAL
// =====================================================================
carregar();
{
  // ganhos enquanto o jogador esteve fora (até 2 horas)
  const fora = Math.min(Date.now() - (estado.salvoEm || Date.now()), 2 * 3600 * 1000) / 1000;
  const ganho = moedasPorSegundo() * fora;
  if (ganho >= 1) {
    estado.moedas += ganho;
    setTimeout(() => aviso(`Enquanto você esteve fora, a fazenda rendeu 🪙 ${fmt(ganho)}!`), 400);
  }
}
if (estado.cliques >= 10) $('dica').textContent = '🛒 Use as moedas na loja para limpar e reconstruir a fazenda!';
redesenharCaches();
sincronizarAnimais();
atualizarRotulos();
montarAbas();
montarLoja();
atualizarHUD();
atualizarProgresso();
atualizarBotoesSom();

let ultimoQuadro = performance.now();
let ultimaRenda = Date.now();
let ultimaLoja = 0;
let proximoSomAmbiente = performance.now() + 8000;
function quadro(t) {
  const dt = Math.min(0.1, (t - ultimoQuadro) / 1000);
  ultimoQuadro = t;

  // a renda usa o relógio real, então nada se perde com a aba em segundo plano
  const agora = Date.now();
  estado.moedas += moedasPorSegundo() * (agora - ultimaRenda) / 1000;
  ultimaRenda = agora;

  // sons ambientes: animais e passarinhos de vez em quando
  if (t > proximoSomAmbiente) {
    proximoSomAmbiente = t + 9000 + Math.random() * 14000;
    const tipos = Object.keys(LIMITES).filter(tem);
    if (tipos.length && Math.random() < 0.7) Som.animal(tipos[Math.floor(Math.random() * tipos.length)], 0.45);
    else if (tem('cerca')) Som.passarinho(0.035);
  }

  atualizarAnimais(dt);
  atualizarParticulas(dt);
  desenhar(t);
  atualizarHUD();
  if (t - ultimaLoja > 200) { atualizarLoja(); ultimaLoja = t; }
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

setInterval(salvar, 5000);
window.addEventListener('beforeunload', salvar);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { salvar(); if (Som.ctx) Som.ctx.suspend(); }
  else if (Som.ctx) Som.ctx.resume();
});
})();
</script>
