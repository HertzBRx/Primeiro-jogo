<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazendinha Renascida</title>
<style>
  :root {
    --madeira: #8b5a2b;
    --madeira-escura: #5e3b1a;
    --papel: #fff8e7;
    --papel-escuro: #f3e6c4;
    --texto: #4a3020;
    --verde: #5cae3e;
    --verde-escuro: #3d7f28;
    --ouro: #f5c542;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(#a8dcff 0%, #d6f0ff 45%, #e6f5cf 100%);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    color: var(--texto);
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Barra do topo ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: var(--madeira);
    border-bottom: 4px solid var(--madeira-escura);
    color: #fff8e7;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .linha1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px; }
  .nome-fazenda {
    font: inherit; font-size: 19px; font-weight: bold; color: #fff8e7; cursor: pointer;
    background: none; border: 2px dashed transparent; border-radius: 8px; padding: 2px 6px;
    text-shadow: 2px 2px 0 var(--madeira-escura); white-space: nowrap; max-width: 320px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .nome-fazenda:hover { border-color: #e0b27a; }
  .nome-fazenda .lapis { font-size: 13px; opacity: .8; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .stat {
    background: var(--papel); color: var(--texto);
    border: 3px solid var(--madeira-escura); border-radius: 10px;
    padding: 3px 9px; font-weight: bold; white-space: nowrap;
    box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .stat.moedas { background: #fff1b8; font-size: 19px; min-width: 140px; text-align: center; }
  .stat small { font-weight: normal; opacity: .8; }
  .stat.estacao { position: relative; overflow: hidden; }
  .stat.estacao .fio { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--verde); }
  .botoes-topo { display: flex; gap: 5px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: bold; cursor: pointer;
    border: 3px solid var(--madeira-escura); border-radius: 10px;
    padding: 4px 10px; background: var(--papel); color: var(--texto);
    box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--madeira-escura); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.icone { min-width: 40px; padding: 4px 6px; }
  .btn.perigo { background: #ffd6cf; }
  .btn.verde { background: #d9f5c8; }
  .btn.desligado { background: #ddd2bd; color: #8a7a66; }
  .btn.mini { padding: 1px 8px; font-size: 12px; border-width: 2px; box-shadow: 0 2px 0 var(--madeira-escura); }

  /* Objetivo do nível, sempre visível */
  .objetivo {
    position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 5px 12px 7px; background: #6e4524; border-top: 2px solid var(--madeira-escura); font-size: 14px;
  }
  .objetivo .nivel {
    background: var(--ouro); color: #5a3a00; font-weight: bold; border-radius: 8px; padding: 1px 8px;
    border: 2px solid #8a6408; white-space: nowrap;
  }
  .objetivo .obj-txt { flex: 1 1 260px; min-width: 0; }
  .objetivo .barra { flex: 0 1 220px; min-width: 120px; height: 12px; background: #4a2c14; border: 2px solid #2e1a0a; border-radius: 8px; overflow: hidden; }
  .objetivo .barra > div { height: 100%; width: 0; background: repeating-linear-gradient(45deg, #7fd15a 0 8px, #6cc24a 8px 16px); transition: width .4s; }
  .objetivo .obj-cont { font-weight: bold; white-space: nowrap; }
  .metas {
    position: absolute; right: 12px; top: 100%; z-index: 40; width: min(420px, 94vw);
    background: var(--papel); color: var(--texto); border: 3px solid var(--madeira); border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .metas h3 { margin: 0 0 6px; font-size: 15px; }
  .metas ul { list-style: none; margin: 0; padding: 0; }
  .metas li { padding: 4px 0; border-bottom: 1px dashed #d8c8a8; font-size: 14px; display: flex; gap: 6px; align-items: baseline; }
  .metas li:last-child { border-bottom: none; }
  .metas li.ok { color: var(--verde-escuro); text-decoration: line-through; }
  .metas .rec { margin-top: 8px; font-size: 13px; background: #fff1b8; border-radius: 8px; padding: 6px 8px; }

  /* ---------- Layout principal ---------- */
  main {
    display: flex; gap: 14px; align-items: flex-start;
    max-width: 1500px; margin: 0 auto; padding: 14px;
  }
  .painel {
    background: var(--papel);
    border: 4px solid var(--madeira); border-radius: 14px;
    box-shadow: 0 5px 0 var(--madeira-escura);
  }
  .fazenda-col { flex: 1.9; min-width: 0; }
  .lateral { flex: 1; min-width: 320px; max-width: 460px; }
  main.sem-lateral .lateral { display: none; }
  main.sem-lateral .fazenda-col { flex: 1; }

  .fazenda-wrap { position: relative; padding: 8px 8px 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas#fazenda {
    display: block; width: 100%; height: auto; aspect-ratio: 800 / 560;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 8px; cursor: grab; touch-action: none;
  }
  canvas#fazenda.arrastando { cursor: grabbing; }
  .barra-ferramentas { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px 10px; }
  .dica-camera { font-size: 12px; opacity: .75; margin-left: auto; }

  /* Faixa de avisos: fixa no topo da área do jogo, discreta e semitransparente (um aviso de cada vez) */
  .ceu {
    position: absolute; left: 8px; right: 8px; top: 8px; z-index: 9; pointer-events: none;
    min-height: 26px; padding: 4px 12px; border-radius: 8px 8px 0 0;
    background: rgba(38, 24, 10, .52); color: #fff8e7; text-align: center;
    font-size: clamp(11px, 1.3vw, 15px); line-height: 1.3; text-shadow: 1px 1px 0 rgba(0,0,0,.45);
    transition: opacity .3s; opacity: 0;
  }
  .ceu.on { opacity: 1; }
  .ceu-msg { font-weight: bold; animation: entraCeu .35s ease-out; }
  .ceu-msg.conquista { color: #ffe27a; }
  .ceu-msg.nivel { color: #c8ff9a; }
  .ceu-msg.alerta { color: #ffd0c0; }
  .ceu-msg small { font-weight: normal; opacity: .9; }
  .ceu-msg.saindo { animation: saiCeu .3s ease-in forwards; }
  @keyframes entraCeu { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes saiCeu { to { opacity: 0; } }
  /* Nome do ajudante (só ao passar o mouse ou tocar) */
  .dica-pessoa {
    position: absolute; z-index: 7; pointer-events: none; transform: translate(-50%, -100%);
    background: rgba(255, 248, 231, .96); color: var(--texto); border: 2px solid var(--madeira-escura);
    border-radius: 8px; padding: 1px 7px; font-size: 12px; font-weight: bold; white-space: nowrap;
  }
  .dica-pessoa small { font-weight: normal; }
  /* Obras em andamento (embaixo do mapa) */
  .obras-barra { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 10px 8px; }
  .obra-chip { display: flex; flex-direction: column; gap: 2px; min-width: 150px; flex: 0 1 220px; font-size: 12px; background: #fff1b8; border: 2px solid #c99a2e; border-radius: 8px; padding: 3px 7px; }
  .obra-chip .cap { margin-top: 0; height: 8px; }
  .obra-chip.espera { background: #eee4d0; border-color: #b8a284; }

  /* Rótulos presos ao mundo (contadores, placas) */
  .rotulos { position: absolute; left: 8px; right: 8px; top: 8px; pointer-events: none; overflow: hidden; border-radius: 8px; }
  .rot {
    position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
    background: rgba(255, 248, 231, .92); color: var(--texto);
    border: 2px solid var(--madeira-escura); border-radius: 8px;
    padding: 0 5px; font-size: clamp(9px, 1.1vw, 13px); font-weight: bold;
    box-shadow: 0 2px 0 var(--madeira-escura);
  }
  .rot.placa { background: #c8955a; color: #fff8e7; border-color: #5e3b1a; text-shadow: 1px 1px 0 #5e3b1a; }
  .rot.frio { background: #e4f4ff; border-color: #3a6a9a; box-shadow: 0 2px 0 #3a6a9a; }
  /* nome escrito na placa de madeira: sem caixa, letras entalhadas, tamanho acompanha o zoom */
  .rot.nome-placa { background: none; border: none; box-shadow: none; padding: 0; color: #fff4dc; font-family: Georgia, "Times New Roman", serif;
    text-shadow: 1px 1px 0 #3a2010, -1px 0 0 #6e4020; overflow: hidden; text-overflow: ellipsis; text-align: center; line-height: 1; }

  .flutua {
    position: absolute; pointer-events: none; z-index: 5;
    font-weight: bold; font-size: 20px; color: #ffe066;
    text-shadow: 2px 2px 0 #7a4a12, -1px -1px 0 #7a4a12, 1px -1px 0 #7a4a12, -1px 1px 0 #7a4a12;
    transform: translate(-50%, -50%); animation: sobe .9s ease-out forwards; white-space: nowrap;
  }
  .flutua.coracao { color: #ff6f91; text-shadow: 1px 1px 0 #7a1a32; }
  @keyframes sobe {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.7); }
    20% { transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
  }

  /* ---------- Lateral: painéis ---------- */
  .paineis { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 4px; border-bottom: 3px solid var(--papel-escuro); }
  .paineis button {
    position: relative; flex: 1 1 auto; cursor: pointer; font-weight: bold; font-size: 13px;
    padding: 6px 6px; border-radius: 9px; border: 2px solid var(--madeira); background: var(--papel-escuro); color: var(--texto);
  }
  .paineis button.ativo { background: var(--madeira); color: #fff8e7; }
  .ponto {
    position: absolute; top: -5px; right: -5px; width: 12px; height: 12px;
    border-radius: 50%; background: #ff5a4f; border: 2px solid #fff8e7; display: none;
  }
  .ponto.on { display: block; }
  #conteudo { padding: 8px 10px 12px; max-height: calc(100vh - 190px); overflow-y: auto; }
  .abas { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .aba {
    position: relative; flex: 1 1 auto; cursor: pointer; font-weight: bold; font-size: 12px;
    padding: 5px 6px; border-radius: 8px; border: 2px solid var(--madeira); background: #fffdf5; color: var(--texto);
  }
  .aba.ativa { background: var(--verde); border-color: var(--verde-escuro); color: #fff; }
  .lista { display: flex; flex-direction: column; gap: 8px; }
  .subtitulo { font-weight: bold; font-size: 13px; margin: 6px 2px 0; opacity: .8; }

  .item {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: #fffdf5; border: 3px solid var(--madeira); border-radius: 10px;
    padding: 7px 9px; box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .item .ico { font-size: 28px; width: 38px; text-align: center; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .nome { font-weight: bold; font-size: 15px; }
  .item .qtd { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 6px; background: var(--verde); color: #fff; font-size: 12px; vertical-align: middle; }
  .item .tier { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 6px; background: #b08458; color: #fff; font-size: 11px; vertical-align: middle; }
  .item .desc { font-size: 12px; opacity: .85; margin-top: 2px; }
  .item .efeito { font-size: 12px; color: var(--verde-escuro); font-weight: bold; margin-top: 2px; }
  .item .custo-extra { font-size: 12px; margin-top: 2px; }
  .item .custo-extra .falta { color: #b03a2e; font-weight: bold; }
  .compras { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .comprar {
    cursor: pointer; font-weight: bold; font-size: 12px; white-space: nowrap;
    background: #fff1b8; border: 2px solid #c99a2e; border-radius: 8px; padding: 2px 7px; color: var(--texto);
  }
  .comprar:hover:not(:disabled) { background: #ffe58a; }
  .comprar:active:not(:disabled) { transform: translateY(1px); }
  .comprar:disabled { background: #f3e2df; border-color: #c98a80; color: #a0453a; cursor: not-allowed; }
  .item.bloqueado { background: #ece3cf; filter: grayscale(.7); opacity: .8; box-shadow: none; }
  .item.misterio .ico { filter: brightness(0); opacity: .35; }
  .item.feito { background: #e7f6dc; border-color: var(--verde-escuro); box-shadow: none; padding: 4px 8px; }
  .item.feito .ico { font-size: 20px; width: 28px; }
  .item.feito .desc, .item.feito .efeito { display: none; }
  .selo { font-size: 12px; font-weight: bold; border-radius: 8px; padding: 2px 7px; white-space: nowrap; background: #ddd; border: 2px solid #aaa; }
  .selo.ok { background: var(--verde); border-color: var(--verde-escuro); color: #fff; }
  .vazio { text-align: center; padding: 10px; font-weight: bold; opacity: .8; }
  details.concluidos { border: 3px dashed var(--madeira); border-radius: 10px; background: var(--papel-escuro); }
  details.concluidos summary { cursor: pointer; padding: 8px 12px; font-weight: bold; list-style: none; user-select: none; }
  details.concluidos summary::-webkit-details-marker { display: none; }
  details.concluidos summary::before { content: '▶ '; font-size: 11px; }
  details.concluidos[open] summary::before { content: '▼ '; }
  details.concluidos .lista { padding: 0 8px 8px; gap: 5px; }

  /* Caixas de informação */
  .caixa-info { background: #fff1b8; border: 2px solid #c99a2e; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .caixa-info b { font-size: 14px; }
  .cap { height: 12px; background: #e9dcc0; border-radius: 6px; overflow: hidden; border: 2px solid var(--madeira); margin-top: 4px; }
  .cap > div { height: 100%; background: #5aa8e0; }
  .grupo-loja { background: #f3e6c4; border: 2px solid #c8a878; border-radius: 10px; padding: 6px 9px; font-size: 13px; }
  .grupo-loja b { font-size: 14px; }
  .grupo-loja .ocup { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; }
  .grupo-loja.frio { background: #e4f4ff; border-color: #6a9aca; }
  .aviso-frio { color: #2a5a8a; font-weight: bold; }
  .item .espera { font-size: 12px; font-weight: bold; color: #8a5a10; }
  .qtd-loja { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 13px; font-weight: bold; }
  .qtd-loja .aba { flex: 0 1 64px; }
  .item.piscando { animation: piscaCard .6s ease-in-out 4; }
  @keyframes piscaCard { 50% { box-shadow: 0 0 0 4px #ffd84a; } }
  .ir-abrigo { margin-top: 4px; }
  .prod {
    display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 8px; align-items: center;
    background: #fffdf5; border: 2px solid #d8c8a8; border-radius: 9px; padding: 5px 8px;
  }
  .prod .pi { font-size: 22px; grid-row: span 2; text-align: center; }
  .prod .pn { font-weight: bold; font-size: 14px; }
  .prod .ps { font-size: 12px; opacity: .8; }
  .prod .pb { grid-row: span 2; display: flex; flex-direction: column; gap: 3px; align-items: stretch; }
  .px-ico { width: 1em; height: 1em; image-rendering: pixelated; vertical-align: -0.12em; }
  .colecao { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .peixe-card { background: #fffdf5; border: 2px solid #d8c8a8; border-radius: 9px; padding: 4px; text-align: center; font-size: 11px; }
  .peixe-card canvas { width: 100%; height: auto; image-rendering: pixelated; display: block; }
  .peixe-card .pn { font-weight: bold; font-size: 12px; }
  .peixe-card.lendario { border-color: #e9a23b; background: linear-gradient(#fffbe6, #fff0c0); }
  .rar { font-size: 10px; font-weight: bold; padding: 0 4px; border-radius: 5px; color: #fff; }
  .fontes { font-size: 12px; margin: 0; padding-left: 0; list-style: none; }
  .fontes li { padding: 1px 0; }
  .fontes li.ok { color: var(--verde-escuro); }
  .previa-eq { margin-top: 6px; font-size: 12px; background: #e7f6dc; border-radius: 8px; padding: 5px 8px; }
  details.detalhe { font-size: 12px; margin-top: 2px; }
  details.detalhe summary { cursor: pointer; font-weight: bold; color: var(--verde-escuro); }

  /* Habilidades */
  .arvore-topo { text-align: center; font-weight: bold; margin-bottom: 6px; }
  .pontos-hab { display: inline-block; background: var(--ouro); border: 2px solid #8a6408; border-radius: 10px; padding: 2px 10px; }
  .arvore { position: relative; width: 100%; aspect-ratio: 5 / 6.4; margin: 4px 0 8px;
    background: radial-gradient(ellipse at 50% 100%, #e6d2a8 0, #f6ead0 60%, #fff8e7 100%); border-radius: 12px; border: 2px solid #d8c8a8; }
  .arvore svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arvore .tronco { stroke: #8b5a2b; stroke-width: 10; stroke-linecap: round; fill: none; }
  .arvore .galho { stroke: #b8a284; stroke-width: 4; stroke-linecap: round; fill: none; transition: stroke .4s; }
  .arvore .galho.aceso { stroke: #f5c542; filter: drop-shadow(0 0 3px #ffd84a); }
  .arvore .galho.acendendo { stroke-dasharray: 120; stroke-dashoffset: 120; animation: acende .7s ease-out forwards; stroke: #ffd84a; }
  @keyframes acende { to { stroke-dashoffset: 0; } }
  .no {
    position: absolute; transform: translate(-50%, -50%); width: 15%; aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 2vw, 22px); cursor: pointer;
    background: #e6dccb; border: 3px solid #a8987e; filter: grayscale(.8); transition: transform .15s;
  }
  .no:hover { transform: translate(-50%, -50%) scale(1.08); }
  .no.disponivel { filter: none; background: #fff6d8; border-color: var(--ouro); animation: brilha 1.6s ease-in-out infinite; }
  .no.ativo { filter: none; background: #ffe58a; border-color: #b8860b; box-shadow: 0 0 10px #ffd84a; }
  .no.selecionado { outline: 3px solid var(--verde); outline-offset: 2px; }
  .no.explode { animation: explode .6s ease-out; }
  @keyframes brilha { 50% { box-shadow: 0 0 12px #ffd84a; } }
  @keyframes explode { 0% { transform: translate(-50%, -50%) scale(1); } 40% { transform: translate(-50%, -50%) scale(1.45); box-shadow: 0 0 30px #fff3a0; } 100% { transform: translate(-50%, -50%) scale(1); } }
  .rotulo-galho { position: absolute; bottom: 1.5%; transform: translateX(-50%); font-size: 11px; font-weight: bold; text-align: center; width: 19%; }
  .faisca { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffe066; pointer-events: none; animation: faisca .8s ease-out forwards; }
  @keyframes faisca { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  .detalhe-hab { background: #fffdf5; border: 3px solid var(--madeira); border-radius: 10px; padding: 8px 10px; }
  .detalhe-hab h4 { margin: 0 0 4px; }

  /* Equipe */
  .pessoa { display: grid; grid-template-columns: 40px 1fr; gap: 4px 8px; align-items: center; background: #fffdf5; border: 3px solid var(--madeira); border-radius: 10px; padding: 7px 9px; }
  .pessoa .av { font-size: 28px; grid-row: span 2; text-align: center; }
  .pessoa .pnome { font-weight: bold; }
  .pessoa .acoes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .pessoa select, .contratar select { font: inherit; font-size: 13px; border: 2px solid var(--madeira); border-radius: 6px; background: #fff; padding: 1px 4px; }
  .contratar { background: #e7f6dc; border: 3px dashed var(--verde-escuro); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .funcoes { font-size: 12px; background: #fff; border-radius: 8px; padding: 6px 8px; border: 1px solid #d8c8a8; }

  /* Conquistas */
  .cq-resumo { text-align: center; font-weight: bold; padding: 8px; border-radius: 10px; background: #fff1b8; border: 2px solid #c99a2e; }
  .cq-resumo small { display: block; font-weight: normal; font-size: 12px; }
  .cq-perto { background: #e7f6dc; border: 2px solid var(--verde-escuro); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .cq { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border: 3px solid #b8a284; border-radius: 10px; background: #ece3cf; }
  .cq .ico { font-size: 24px; width: 34px; text-align: center; flex-shrink: 0; }
  .cq .info { flex: 1; min-width: 0; }
  .cq .nome { font-weight: bold; font-size: 14px; }
  .cq .desc { font-size: 12px; opacity: .85; }

const CHAVE_SAVE = 'fazendinha-renascida-v4';
// Saves de versões anteriores: quem tiver um deles ganha o aviso de "nova versão" e a conquista Fundador
const CHAVES_ANTIGAS = ['fazendinha-renascida-v1', 'fazendinha-renascida-v3'];
const CHAVE_CONFIG = 'fazendinha-renascida-config';

const novosContadores = () => ({ carinhos: 0, carinhosGato: 0, carinhosCachorro: 0, espantalho: 0, cliquesInverno: 0,
  colheitaInverno: 0, trocasFuncao: 0, renomeou: 0, invernos: 0, escaparam: 0, invernoAbrigado: 0 });
const novoEstado = () => ({
  versao: 4, nome: '', moedas: 0, ganhoTotal: 0, cliques: 0, tempo: 0, tempoJogo: 0,
  itens: {}, produzido: {}, minerios: {}, minerado: {}, minaFundo: 1, minaAcum: 0,
  peixes: {}, pescados: {}, produzindo: {}, nivel: 1, pontos: 0, habilidades: {}, obras: [], equipe: [], conquistas: {},
  contadores: novosContadores(), tutorial: { passo: 0, pulou: false }, salvoEm: Date.now(),
});
let estado = novoEstado();
let config = { musica: true, efeitos: true, fundador: false };
let versaoNova = false; // este navegador tinha um save de uma versão anterior

function carregar() {
  try { Object.assign(config, JSON.parse(localStorage.getItem(CHAVE_CONFIG) || '{}')); } catch (e) {}
  try {
    const bruto = localStorage.getItem(CHAVE_SAVE);
    if (bruto) {
      const d = JSON.parse(bruto);
      estado = Object.assign(novoEstado(), d);
      estado.contadores = Object.assign(novosContadores(), d.contadores || {});
      estado.tutorial = Object.assign({ passo: 0, pulou: false }, d.tutorial || {});
      if (!Array.isArray(estado.obras)) estado.obras = [];
      return true;
    }
  } catch (e) { estado = novoEstado(); }
  // só quem tinha um save antigo neste navegador vê o aviso e ganha a conquista Fundador
  for (const k of CHAVES_ANTIGAS) {
    try {
      if (localStorage.getItem(k)) { versaoNova = true; config.fundador = true; localStorage.removeItem(k); salvarConfig(); }
    } catch (e) {}
  }
  return false;
}
function salvar() {
  estado.salvoEm = Date.now();
  try { localStorage.setItem(CHAVE_SAVE, JSON.stringify(estado)); } catch (e) {}
}
function salvarConfig() {
  try { localStorage.setItem(CHAVE_CONFIG, JSON.stringify(config)); } catch (e) {}
}

function emitir(tipo, dados) { for (const f of ouvintes) f(tipo, dados); }

// ---------- Consultas básicas ----------
const qtd = id => estado.itens[id] || 0;
const tem = id => qtd(id) > 0;
const hab = id => !!estado.habilidades[id];
const habilidadesTotal = () => HABILIDADES.filter(h => hab(h.id)).length;
const totalMinerado = () => Object.values(estado.minerado).reduce((s, n) => s + n, 0);
const contarFuncao = f => estado.equipe.filter(p => p.funcao === f).length;
const totalAnimais = () => PRODUTORES.filter(i => i.cat === 'animais').reduce((s, i) => s + qtd(i.id), 0);
const estacao = () => Math.floor(estado.tempo / DURACAO_ESTACAO) % 4;
const fracEstacao = () => (estado.tempo % DURACAO_ESTACAO) / DURACAO_ESTACAO;
const anoAtual = () => Math.floor(estado.tempo / (DURACAO_ESTACAO * 4)) + 1;
const inverno = () => estacao() === 3;
// Hora do dia: 0 = amanhecer; a noite vai de 0,68 a 1
const horaDoDia = () => (estado.tempo % DURACAO_DIA) / DURACAO_DIA;
const noite = () => horaDoDia() >= 0.68;
function escuridao() { // 0 de dia, até 1 no meio da noite (com entardecer e amanhecer suaves)
  const h = horaDoDia();
  if (h < 0.06) return 1 - h / 0.06;
  if (h < 0.6) return 0;
  if (h < 0.72) return (h - 0.6) / 0.12;
  return 1;
}
// Pesca
const pescado = id => (estado.pescados[id] || 0) > 0;
const totalPescado = () => Object.values(estado.pescados).reduce((s, n) => s + n, 0);
const especiesPescadas = () => PEIXES.filter(p => pescado(p.id)).length;
const pescadosEm = local => PEIXES.filter(p => p.local === local).reduce((s, p) => s + (estado.pescados[p.id] || 0), 0);

function tierLinha(linha) {
  const l = LINHAS[linha];
  if (!l) return 0;
  for (let t = l.length - 1; t >= 1; t--) if (l[t] && tem(l[t].id)) return t;
  return 0;
}
function dadoLinha(linha) { const t = tierLinha(linha); return t ? LINHAS[linha][t] : LINHA_BASE[linha]; }
function ferramentasNoTier(t) {
  // a vara tem um nível a mais (começa na madeira), então o "prata" dela é o tier 3
  return LINHAS_FERRAMENTA.filter(l => tierLinha(l) - (l === 'vara' ? 1 : 0) >= t).length;
}
const capEstufa = () => dadoLinha('estufa').cap || 0;
// Cada espécie só pode ter os animais que cabem no seu abrigo (as abelhas, no apiário)
const LINHA_ABRIGO = esp => ABRIGOS[esp] ? ABRIGOS[esp].linha : esp === 'abelhas' ? 'apiario' : null;
const capAbrigo = esp => LINHA_ABRIGO(esp) ? (dadoLinha(LINHA_ABRIGO(esp)).cap || 0) : Infinity;
// O item que abriga uma espécie (para o botão "Ir para o abrigo")
function itemAbrigo(esp) {
  if (esp === 'cachorro') return ITEM.casinhaCachorro;
  if (esp === 'gato') return ITEM.casa;
  const l = LINHA_ABRIGO(esp);
  return l ? (LINHAS[l][tierLinha(l) + 1] || LINHAS[l][tierLinha(l)]) : null;
}
function vagasEquipe() {
  let v = 0;
  for (const n in VAGAS_NIVEL) if (estado.nivel >= Number(n)) v = Math.max(v, VAGAS_NIVEL[n]);
  if (tem('cabana')) v += 1;
  if (hab('e3')) v += 1;
  return v;
}
function andarMaximo() {
  let lim = 0;
  for (const n in ANDARES_POR_NIVEL) if (estado.nivel >= Number(n)) lim = Math.max(lim, ANDARES_POR_NIVEL[n]);
  return Math.min(lim, dadoLinha('picareta').fundo);
}

// ---------- Multiplicadores ----------
function bonusConquistas() {
  let pct = 0;
  for (const c of CONQUISTAS) if (estado.conquistas[c.id]) pct += BONUS_MEDALHA[c.medalha];
  return 1 + pct / 100;
}
const bonusGlobal = () => bonusConquistas() * (tem('casarao') ? 1.1 : 1);
// Habilidades de equipe multiplicam o bônus de cada ajudante
const multEquipe = (extra) => HABILIDADES.filter(h => h.equipe && (hab(h.id) || h.id === extra)).reduce((m, h) => m * h.equipe, 1);
function bonusFuncao(f, extra) { return FUNCOES[f].base * multEquipe(extra) * contarFuncao(f); }
function detalheFuncao(f) {
  const partes = [`Base: ${fmtPct(FUNCOES[f].base, f)} por ajudante`];
  for (const h of HABILIDADES.filter(x => x.equipe)) partes.push(`${hab(h.id) ? '✔' : '✖'} ${h.nome}: ×${String(h.equipe).replace('.', ',')}${hab(h.id) ? '' : ' (ainda não desbloqueada)'}`);
  partes.push(`Ajudantes nesta função: ${contarFuncao(f)}`);
  return partes;
}
function fmtPct(v, f) { return f === 'minerador' ? `${fmtTaxa(v)}/min` : `+${Math.round(v * 100)}%`; }

function fatorEstacao(item, est) {
  const fav = item.favor && item.favor.includes(est) ? (hab('a3') ? 2 : 1.5) : 1;
  if (item.planta === 'estufa') return est === 3 ? (hab('a4') ? 1.5 : 1) : fav;
  if (item.planta === 'inverno') return est === 3 ? (hab('a3') ? 2 : 1.5) : [0.6, 0.5, 0.8][est];
  if (est === 3) return Math.min(0.7, 0.25 + 0.15 * contarFuncao('jardineiro') * multEquipe());
  return fav;
}
// No inverno todos os animais ficam nos abrigos (sempre cabem: o abrigo é o limite)
const fatorAbrigo = (esp, est) => est === 3 && ABRIGOS[esp] && hab('p4') ? 1.3 : 1;
function multPlantas() {
  return (1 + dadoLinha('regador').bonus) * (hab('a1') ? 1.15 : 1) * (hab('a2') ? 1.1 : 1) * (hab('a5') ? 1.5 : 1)
    * (1 + bonusFuncao('colheita'));
}
function multAnimais() {
  return (1 + dadoLinha('balde').bonus) * (1 + (dadoLinha('celeiro').bonus || 0)) * (hab('p1') ? 1.15 : 1)
    * (hab('p2') && (tem('cachorro') || tem('gato')) ? 1.2 : 1) * (hab('p5') ? 1.5 : 1) * (1 + bonusFuncao('tratador'));
}
const multVendas = () => (hab('c1') ? 1.1 : 1) * (hab('c5') ? 1.25 : 1) * (1 + bonusFuncao('feirante'));
function precoVenda(p) {
  const d = PRODUTOS[p];
  let v = d.preco;
  if (d.art) { if (hab('r4')) v *= 1.2; if ((p === 'queijo' || p === 'geleia') && hab('r2')) v *= 1.25; }
  else if (hab('c4')) v *= 1.2;
  return v * multVendas();
}

// Fluxo de produção em unidades por segundo, já com as transformadoras
let fluxo = { prod: {}, diretas: 0 };
let rendaPotencial = 0; // moedas por segundo (tudo é vendido automaticamente)
function calcularFluxos() {
  const est = estacao(), g = bonusGlobal(), mP = multPlantas(), mA = multAnimais();
  const flores = 1 + bonusFuncao('jardineiro');
  const prod = {};
  let diretas = 0;
  for (const it of PRODUTORES) {
    const n = qtd(it.id);
    if (!n) continue;
    let r = n * it.renda * g;

// ---------- Música de fundo gerada (lo-fi aconchegante, muda com a estação) ----------
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Musica = {
  passo: 60 / 76 / 2,
  tocando: false, n: 0, proximo: 0, timer: null, nota: 3,
  progressoes: [
    [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]], // primavera: Fmaj7 Em7 Dm7 Cmaj7
    [[48, 52, 55, 59], [53, 57, 60, 64], [55, 59, 62, 65], [52, 55, 59, 62]], // verão: Cmaj7 Fmaj7 G7 Em7
    [[50, 53, 57, 60], [55, 59, 62, 65], [48, 52, 55, 59], [45, 48, 52, 55]], // outono: Dm7 G7 Cmaj7 Am7
    [[45, 48, 52, 55], [53, 57, 60, 64], [48, 52, 55, 59], [52, 55, 59, 62]], // inverno: Am7 Fmaj7 Cmaj7 Em7
  ],
  escala: [67, 69, 72, 74, 76, 79, 81, 84],
  iniciar() {
    if (!Som.ctx || this.tocando) return;
    this.tocando = true;
    this.proximo = Som.ctx.currentTime + 0.15;
    this.timer = setInterval(() => this.agendar(), 100);
  },
  parar() { this.tocando = false; clearInterval(this.timer); },
  agendar() {
    const ctx = Som.ctx;
    if (ctx.state !== 'running') return;
    if (this.proximo < ctx.currentTime - 0.1) this.proximo = ctx.currentTime + 0.05;
    while (this.proximo < ctx.currentTime + 0.4) {
      this.tocarPasso(this.n, this.proximo);
      this.proximo += this.passo * (inverno() ? 1.15 : 1); this.n++;
    }
  },
  tocarPasso(n, t) {
    const compasso = Math.floor(n / 8), dentro = n % 8;
    const acorde = this.progressoes[estacao()][compasso % 4];
    const dest = Som.mus;
    if (dentro === 0) {
      for (const nt of acorde) {
        Som.tom(midi(nt), t, this.passo * 8.6, { vol: 0.03, ataque: 0.7, destino: dest });
        Som.tom(midi(nt + 12), t, this.passo * 8.6, { vol: 0.008, ataque: 0.9, detune: 7, tipo: 'triangle', destino: dest });
      }
    }
    if (dentro === 0 || dentro === 4) {
      const nt = (dentro === 0 ? acorde[0] : acorde[2]) - 12;
      Som.tom(midi(nt), t, this.passo * 3.6, { tipo: 'triangle', vol: 0.1, ataque: 0.02, destino: dest });
    }
    if (dentro % 2 === 1 && !inverno()) Som.ruido(t, 0.05, { filtro: 'highpass', freq: 7000, vol: 0.012, destino: dest });
    const frase = Math.floor(compasso / 4) % 4;
    let prob = dentro % 2 === 0 ? 0.55 : 0.2;
    if (frase === 3) prob *= 0.4;
    if (inverno()) prob *= 0.7;
    if (Math.random() < prob) {
      if (dentro === 0) {
        const alvo = acorde[1 + Math.floor(Math.random() * 3)] + 12;
        this.nota = this.escala.reduce((m, v, i) => Math.abs(v - alvo) < Math.abs(this.escala[m] - alvo) ? i : m, 0);
      } else {
        this.nota = Math.max(0, Math.min(this.escala.length - 1, this.nota + Math.floor(Math.random() * 5) - 2));
      }
      const f = midi(this.escala[this.nota]);
      Som.tom(f, t, 1.3, { vol: 0.055, destino: dest, eco: true });
      Som.tom(f * 2, t, 0.35, { vol: 0.012, destino: dest });
    }
  },
};

// DESENHO: utilidades de pixel art e sprites
// =====================================================================
const W = 800, H = 504;     // tamanho do mundo
const CEU = 56;             // faixa de céu no topo da tela
const TELA_W = 800, TELA_H = H + CEU;
const canvas = $('fazenda');
const tela = canvas.getContext('2d');
tela.imageSmoothingEnabled = false;
const mundo = novoCanvas(W, TELA_H); // céu (CEU px) + mundo: o céu faz parte do cenário e anda com a câmera
const ctxMundo = mundo.getContext('2d');
let c = ctxMundo; // contexto atual

function novoCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
function comCtx(ctx, fn) { const antigo = c; c = ctx; fn(); c = antigo; }
function R(x, y, w, h, cor) { c.fillStyle = cor; c.fillRect(Math.round(x), Math.round(y), w, h); }
function circulo(cx, cy, r, cor) {
  c.fillStyle = cor;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5);
    c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function elipse(cx, cy, rx, ry, cor) {
  c.fillStyle = cor;
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / ry) * (dy / ry))));
    c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function sombra(cx, cy, rx, ry) { elipse(cx, cy, rx, ry, 'rgba(30,40,10,.22)'); }
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function misturar(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function telhado(cx, yTopo, linhas, larguraTopo, cores, borda) {
  for (let i = 0; i < linhas; i++) {
    const w = larguraTopo + i * 2;
    R(cx - w / 2, yTopo + i, w, 1, cores[i % cores.length]);
    if (i % 2 === 0) for (let k = (i % 4 ? 2 : 0); k < w; k += 4) R(cx - w / 2 + k, yTopo + i, 1, 1, borda);
  }
  const wb = larguraTopo + (linhas - 1) * 2;
  R(cx - wb / 2, yTopo + linhas - 1, wb, 1, borda);
}
function neveTelhado(cx, yTopo, linhas, larguraTopo) {
  if (!inverno()) return;
  for (let i = 0; i < Math.min(linhas, 4); i++) { const w = larguraTopo + i * 2; R(cx - w / 2, yTopo + i, w, 1, i % 2 ? '#eef4fa' : '#ffffff'); }
}

// Sprites a partir de "desenhos" em texto, com contorno automático
function criarSprite(linhas, paleta, contorno) {
  const h = linhas.length, w = Math.max(...linhas.map(l => l.length));
  const cv = novoCanvas(w + 2, h + 2), x = cv.getContext('2d');
  const cheio = (i, j) => j >= 0 && j < h && i >= 0 && i < (linhas[j] || '').length && paleta[linhas[j][i]];
  if (contorno) {
    x.fillStyle = contorno;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (cheio(i, j)) continue;
      if (cheio(i - 1, j) || cheio(i + 1, j) || cheio(i, j - 1) || cheio(i, j + 1)) x.fillRect(i + 1, j + 1, 1, 1);
    }
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < linhas[j].length; i++) {
    const cor = paleta[linhas[j][i]];
    if (cor) { x.fillStyle = cor; x.fillRect(i + 1, j + 1, 1, 1); }
  }
  return cv;
}
function espelhar(cv) {
  const e = novoCanvas(cv.width, cv.height), x = e.getContext('2d');
  x.translate(cv.width, 0); x.scale(-1, 1); x.drawImage(cv, 0, 0);
  return e;
}
function conjunto(quadros, paleta, contorno) {
  const r = {};
  for (const k in quadros) { const d = criarSprite(quadros[k], paleta, contorno); r[k] = { d, e: espelhar(d) }; }
  return r;
}

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, t = terreno[i], s = sombraGrama[i], h = hash2(x * 3, y * 5);
    const a = areaDe(x, y);
    let cor;
    if (t === T.CAMINHO) {

      if (pedra && ((x + (y >> 2)) % 4 === 0 || y % 4 === 0)) cor = camRGB[3];
      if (a && suj[a] > 0.4 && hash2(x, y * 2) < suj[a] * 0.5) cor = misturar(pal[s], SECA[s], suj[a]);
    } else if (t === T.RIACHO) cor = (x + y) % 9 === 0 ? aguaF : agua;
    else if (t === T.LAGO) cor = dentroLago(x, y, -16) ? lagoF : lagoC;
    else if (t === T.AREIA) cor = h < 0.3 ? areiaE : areia;
    else if (t === T.CANAL) cor = canalOk ? (inv ? agua : (y === 362 ? aguaF : agua)) : (h < 0.4 ? lamaE : lama);

    else {

    d[i * 4] = cor[0]; d[i * 4 + 1] = cor[1]; d[i * 4 + 2] = cor[2]; d[i * 4 + 3] = 255;

      const a = areaDe(f.x, f.y);

      R(f.x - 1, f.y, 1, 1, f.cor); R(f.x + 1, f.y, 1, 1, f.cor); R(f.x, f.y - 1, 1, 1, f.cor); R(f.x, f.y, 1, 1, '#ffe27a');

    const pm = Math.min(qtd('milho') * 2, 56);

    const pg = vis('girassol', 24);

    const pc = vis('cafe', 32);
    for (let r = 0; r < 4; r++) { const n = Math.max(0, Math.min(8, pc - r * 8)); if (n) R(268, 30 + r * 28 - 1, n * 14 + 4, 4, '#6e4426'); }
    // lama do chiqueiro
    if (tem('troncos')) { elipse(590, 330, 22, 9, '#6b4a2b'); elipse(589, 329, 18, 7, '#7d5634'); R(578, 327, 4, 1, '#94693f'); }
  });
}

const CORES_CEU = [['#7cc4ff', '#d2efff'], ['#4fb0ff', '#c4e8ff'], ['#f0a868', '#ffe2b8'], ['#8aa2bc', '#dde6ef']];
function desenharCeu(t) {
  // coordenadas do mundo: o céu vai de y = -CEU (topo) até 0 (onde começa a colina)
  const est = estacao(), h = horaDoDia();
  const g = c.createLinearGradient(0, -CEU, 0, 0);

  c.fillStyle = g; c.fillRect(0, -CEU, W, CEU);
  if (h < 0.7) { // sol atravessando o céu durante o dia
    const f = h / 0.7, sx = 40 + f * 720, sy = -CEU + 30 - Math.sin(f * Math.PI) * 20;
    circulo(sx, sy, 11, est === 2 ? '#ffd08a' : '#fff3b0'); circulo(sx, sy, 9, est === 2 ? '#ffc060' : est === 3 ? '#fff8e0' : '#ffe066');
  }
  for (const n of CEN.nuvensCeu) {
    const x = ((n.x + t / 1000 * n.v) % (W + 120)) - 60, y = n.y - CEU;
    R(x, y, n.w, 6, '#ffffff'); R(x + 6, y - 4, n.w - 18, 4, '#ffffff'); R(x + 2, y + 6, n.w - 4, 2, '#eaf4ff');
  }

    const x = ((t / 40 + i * 260) % (W + 100)) - 50, y = -CEU + 14 + i * 9 + Math.sin(t / 300 + i) * 2;
    const asa = Math.floor(t / 150 + i) % 2;
    R(x - 2, y - asa, 2, 1, '#3a3a4a'); R(x + 1, y - asa, 2, 1, '#3a3a4a'); R(x, y, 1, 1, '#3a3a4a');
  }

  for (let x = 0; x < W; x += 2) {

    R(x, -hs, 2, hs, est === 3 ? '#b8c6d2' : est === 2 ? '#b89a6a' : '#86ae8a');

}

const camera = { x: 200, y: 126, zoom: 2, alvoX: null, alvoY: null };
const vistaW = () => TELA_W / camera.zoom, vistaH = () => TELA_H / camera.zoom;
const limiteX = x => Math.max(0, Math.min(W - vistaW(), x));

function limitarCamera() { camera.x = limiteX(camera.x); camera.y = limiteY(camera.y); }
function centrarCamera(x, y, suave = true) {

  const ax = limiteX(x - vistaW() / 2), ay = limiteY(y - vistaH() / 2);

}
function moverCameraSuave(dt) {

  limitarCamera();

}

// Escolhe um lado do alvo onde o balão cabe inteiro, sem encostar no alvo
function posicionarBalao(alvo) {
  const r = alvo.getBoundingClientRect(), b = balao.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight, m = 14;
  const lados = [
    ['dir', r.right + m, r.top + r.height / 2 - b.height / 2],
    ['esq', r.left - m - b.width, r.top + r.height / 2 - b.height / 2],
    ['baixo', r.left + r.width / 2 - b.width / 2, r.bottom + m],
    ['cima', r.left + r.width / 2 - b.width / 2, r.top - m - b.height],
  ];
  let escolhido = null;
  for (const [lado, x, y] of lados) {
    const cx = Math.max(6, Math.min(vw - b.width - 6, x)), cy = Math.max(6, Math.min(vh - b.height - 6, y));
    const sobrepoe = cx < r.right && cx + b.width > r.left && cy < r.bottom && cy + b.height > r.top;
    if (!sobrepoe) { escolhido = [lado, cx, cy]; break; }
  }
  if (!escolhido) { // alvo enorme: vai para o canto mais longe dele
    const cx = r.left + r.width / 2 > vw / 2 ? 6 : vw - b.width - 6, cy = r.top + r.height / 2 > vh / 2 ? 6 : vh - b.height - 6;
    escolhido = ['nenhum', cx, cy];
  }
  const [lado, x, y] = escolhido;
  balao.style.left = x + 'px'; balao.style.top = y + 'px';
  const seta = balao.querySelector('.seta');
  seta.style.cssText = '';
  const cor = 'var(--verde-escuro)';
  if (lado === 'dir') Object.assign(seta.style, { left: '-20px', top: Math.max(8, Math.min(b.height - 28, r.top + r.height / 2 - y - 10)) + 'px', borderRightColor: cor });
  else if (lado === 'esq') Object.assign(seta.style, { right: '-20px', top: Math.max(8, Math.min(b.height - 28, r.top + r.height / 2 - y - 10)) + 'px', borderLeftColor: cor });
  else if (lado === 'baixo') Object.assign(seta.style, { top: '-20px', left: Math.max(8, Math.min(b.width - 28, r.left + r.width / 2 - x - 10)) + 'px', borderBottomColor: cor });
  else if (lado === 'cima') Object.assign(seta.style, { bottom: '-20px', left: Math.max(8, Math.min(b.width - 28, r.left + r.width / 2 - x - 10)) + 'px', borderTopColor: cor });
}

      if (p.escamas) for (let i = -meia * 0.7; i < meia * 0.7; i += 3) for (let j = -hh * 0.5; j < hh * 0.6; j += 3) R(cx + i + (Math.round(j) % 2), cy + j, 1, 1, '#c83020');

    ultimoSomAnimal = performance.now();
    Som.animal(alvo.tipo === 'gato' ? (Math.random() < 0.5 ? 'gato' : 'ronrom') : alvo.tipo);
    coracao(alvo.x, alvo.y - 16);
    estado.contadores.carinhos++;
    if (alvo.tipo === 'gato') estado.contadores.carinhosGato++;
    if (alvo.tipo === 'cachorro') estado.contadores.carinhosCachorro++;
    alvo.pulo = 1; alvo.espera = Math.max(alvo.espera, 1);
  } else Som.clique();
}
// setas do teclado também movem a câmera
const teclas = {};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) { teclas[e.key] = true; e.preventDefault(); }
  Som.iniciar();
});
addEventListener('keyup', e => { delete teclas[e.key]; });
function moverPorTeclas(dt) {
  if (camera.zoom === 1) return;
  const v = 160 * dt;
  if (teclas.ArrowLeft) camera.x -= v; if (teclas.ArrowRight) camera.x += v;
  if (teclas.ArrowUp) camera.y -= v; if (teclas.ArrowDown) camera.y += v;
  if (Object.keys(teclas).length) { camera.alvoX = camera.alvoY = null; limitarCamera(); tutorial.arrastou = true; }
}

// ---------- Botões ----------
$('btnVerTudo').addEventListener('click', () => {
  const cx = camera.x + vistaW() / 2, cy = camera.y + vistaH() / 2;
  camera.zoom = camera.zoom === 1 ? 2 : 1;
  camera.alvoX = camera.alvoY = null;
  if (camera.zoom === 1) { camera.x = 0; camera.y = -CEU; } else centrarCamera(cx, cy, false);
  $('btnVerTudo').textContent = camera.zoom === 1 ? '🔎 Aproximar' : '🔍 Ver fazenda inteira';
  tutorial.arrastou = true;
});
function atualizarBotoesSom() {
  $('btnMusica').classList.toggle('desligado', !config.musica);
  $('btnEfeitos').classList.toggle('desligado', !config.efeitos);
  $('btnMusica').textContent = config.musica ? '🎵' : '🔇';
  $('btnEfeitos').textContent = config.efeitos ? '🔊' : '🔈';
}
$('btnMusica').addEventListener('click', () => { config.musica = !config.musica; salvarConfig(); Som.iniciar(); Som.ajustar(); atualizarBotoesSom(); });
$('btnEfeitos').addEventListener('click', () => { config.efeitos = !config.efeitos; salvarConfig(); Som.iniciar(); Som.ajustar(); atualizarBotoesSom(); if (config.efeitos) Som.clique(); });
$('btnTelaCheia').addEventListener('click', () => {
  const d = document, raiz = d.documentElement;
  const ativo = d.fullscreenElement || d.webkitFullscreenElement;
  if (ativo) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else if (raiz.requestFullscreen) raiz.requestFullscreen().catch(() => {});
  else if (raiz.webkitRequestFullscreen) raiz.webkitRequestFullscreen();
});
document.addEventListener('fullscreenchange', () => { $('btnTelaCheia').textContent = document.fullscreenElement ? '🗗' : '⛶'; setTimeout(ajustarCeu, 50); });
$('btnLateral').addEventListener('click', () => {
  const p = $('principal');
  p.classList.toggle('sem-lateral');
  $('btnLateral').classList.toggle('desligado', p.classList.contains('sem-lateral'));
  $('btnLateral').title = p.classList.contains('sem-lateral') ? 'Mostrar a loja' : 'Esconder a loja';
  setTimeout(ajustarCeu, 30);
});
$('btnReiniciar').addEventListener('click', () => abrirConfirmacao('🔄 Reiniciar o jogo?', 'Todo o progresso (itens, níveis, habilidades, equipe e conquistas) será perdido e a fazenda voltará a ficar abandonada. Tem certeza?', 'Sim, recomeçar', () => {
  try { localStorage.removeItem(CHAVE_SAVE); } catch (e) {}
  estado = novoEstado();
  animais = []; pessoas = []; particulas = [];
  painelAtual = 'loja'; abaLoja = 'limpeza'; fecharMina(); fecharPesca();
  Object.assign(tutorial, { arrastou: false, vistoObjetivo: false, minaAberta: false, vistoMina: false, pescaAberta: false });
  camera.zoom = 2; centrarCamera(400, 250, false); $('btnVerTudo').textContent = '🔍 Ver fazenda inteira';
  calcularFluxos(); redesenharCaches(); abrirPainel('loja'); atualizarTudo(true); salvar();
  abrirNomeFazenda(true);
}));
modal.addEventListener('click', e => { if (e.target === modal && caixaModal.querySelector('[data-nao]')) fecharModal(); });
addEventListener('resize', () => { ajustarCeu(); if (!balao.hidden && alvoTutorial) posicionarBalao(alvoTutorial); });
document.addEventListener('pointerdown', () => Som.iniciar());

// =====================================================================
// INÍCIO
// =====================================================================
const tinhaSave = carregar();
calcularFluxos();
if (tinhaSave) {
  const fora = (Date.now() - (estado.salvoEm || Date.now())) / 1000;
  if (fora > 10) {
    const g = simularAusencia(fora);
    if (g >= 1) setTimeout(() => avisar(`🌙 Enquanto você esteve fora (${fmtTempo(Math.min(fora, 7200))}), a fazenda rendeu 🪙 ${fmt(g)}!`, '', 5000), 600);
  }
}
carregando = false;
centrarCamera(400, 250, false);
redesenharCaches();
sincronizarAnimais(); sincronizarPessoas();
aplicarNome();
abrirPainel('loja');
atualizarTudo(true);
atualizarBotoesSom();
ajustarCeu();
verificarConquistas(tinhaSave);
if (versaoNova) {
  abrirModal(`<h2>🌻 Nova versão da Fazendinha!</h2><p>A fazenda ficou <b>muito maior</b>: novas áreas, níveis, árvore de habilidades, produtos artesanais, estações do ano, dia e noite, ajudantes, abrigos para cada animal, uma mina e pesca!</p>
    <p>Como mudou muita coisa, <b>o seu progresso antigo recomeçou do zero</b>. Como agradecimento por jogar desde o começo, você ganhou a conquista secreta <b>🎖️ Fundador</b>.</p>
    <div class="botoes"><button class="btn verde" data-ok>Vamos lá!</button></div>`, cx => { cx.querySelector('[data-ok]').onclick = () => { fecharModal(); abrirNomeFazenda(true); }; });
} else if (!estado.nome) abrirNomeFazenda(true);
else setTimeout(() => avisar(`🌻 Bem-vindo de volta à <b>${estado.nome}</b>!`), 200);

// =====================================================================
// LOOP PRINCIPAL
// =====================================================================
let ultimoQuadro = performance.now(), ultimoReal = Date.now(), acum = 0, acumLento = 0, assinaturaRotulos = '';
function assinaturaR() {
  return Object.keys(LIMITES).concat(['abelhas']).map(qtd).join(',') + '|' + Object.keys(ABRIGOS).map(capAbrigo).join(',') + '|' + estado.nivel + '|' + inverno() + '|' + tem('placa') + estado.nome;
}
function quadro(t) {
  const dtv = Math.max(0, Math.min(0.1, (t - ultimoQuadro) / 1000));
  ultimoQuadro = t;
  const agora = Date.now();
  const dtr = (agora - ultimoReal) / 1000;
  ultimoReal = agora;
  if (dtr > 5) { // voltou de outra aba: simula o tempo que passou
    const g = simularAusencia(dtr);
    if (g >= 1) avisar(`🌙 Enquanto a aba estava em segundo plano, a fazenda rendeu 🪙 ${fmt(g)}!`);
  } else if (dtr > 0) { tick(dtr); estado.tempoJogo += dtr; }

  acum += dtv; acumLento += dtv;
  if (acum > 0.25) {
    acum = 0;
    verificarNivel();
    verificarConquistas(false);
    avisosDeEstacao();
    dicaOcasional(t);
    atualizarTudo(false);
    atualizarTutorial();
    if (mina.aberta) atualizarTopoMina();
    if (pesca.aberta) atualizarTopoPesca();
    posicionarFaixa();
  }
  if (acumLento > 1) {
    acumLento = 0;
    sincronizarAnimais();
    const a = assinaturaR();
    if (a !== assinaturaRotulos) { assinaturaRotulos = a; montarRotulos(); }
    $('btnMina').hidden = !tem('minaEntrada');
    $('btnPesca').hidden = !varaTier();
    // sons do ambiente de vez em quando
    if (Math.random() < 0.06) {
      const tipos = Object.keys(LIMITES).filter(k => visiveisAnimal(k) > 0);
      if (tipos.length && Math.random() < 0.7) Som.animal(escolhe(tipos), 0.4);
      else if (!inverno() && tem('cerca')) Som.passarinho(0.03);
    }
  }
  moverPorTeclas(dtv);
  moverCameraSuave(dtv);
  atualizarAnimais(dtv);
  atualizarPessoas(dtv);
  atualizarParticulas(dtv);
  compor(t, dtv);
  posicionarRotulos();
  seguirDica();
  desenharMina(t, dtv);
  desenharPesca(t, dtv);
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

setInterval(salvar, 5000);
addEventListener('beforeunload', salvar);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { salvar(); if (Som.ctx) Som.ctx.suspend(); }
  else if (Som.ctx) Som.ctx.resume();
});

// Ganchos para testes automatizados (só com ?teste na URL)
if (location.search.includes('teste')) window.__fazenda = { get estado() { return estado; }, get pessoas() { return pessoas; }, get animais() { return animais; }, set estado(v) { estado = v; },
  get rendaPotencial() { return rendaPotencial; }, get abaLoja() { return abaLoja; }, set abaLoja(v) { abaLoja = v; },
  ITEM, ITENS, NIVEIS, CONQUISTAS, PEIXES, LOCAL, PLACA, CEU, tick, comprar, calcularFluxos, redesenharCaches, sincronizarAnimais, sincronizarPessoas, atualizarTudo, abrirPainel,
  contratar, camera, abrirMina, fecharMina, abrirPesca, fecharPesca, pesca, verificarNivel, montarRotulos, mina, verificarConquistas, visivelNaLoja, maxAcessivel, fontesDePontos,
  pontosPossiveis, pontosGanhos, telaParaMundo, mundoParaPct, limitarCamera, destacar, adiantarObras, registrarPeixe, sortearPeixe, desbloquearHabilidade, HABILIDADES, HAB,
  bonusFuncao, multEquipe, metasDoProximo, mundo, desenharMundo, tutorial, config, salvar, addMinerio, capAbrigo, itemAbrigo, limiteCapacidade, textoReq, LINHA_ABRIGO, posDestaque, aoComprar, clicarComprar, get qtdLoja() { return qtdLoja; }, set qtdLoja(v) { qtdLoja = v; }, emObra, obraQueBloqueia, andarMaximo, localLiberado, avaliar: codigo => eval(codigo) };
})();
</script>
