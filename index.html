<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazendinha Renascida</title>
<style>
  :root {
    --madeira: #8b5a2b;
    --madeira-escura: #5e3b1a;
    --papel: #fff8e7;
    --papel-escuro: #f3e6c4;
    --texto: #4a3020;
    --verde: #5cae3e;
    --verde-escuro: #3d7f28;
    --ouro: #f5c542;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(#a8dcff 0%, #d6f0ff 45%, #e6f5cf 100%);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    color: var(--texto);
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Barra do topo ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: var(--madeira);
    border-bottom: 4px solid var(--madeira-escura);
    color: #fff8e7;
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
  }
  .linha1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px; }
  .nome-fazenda {
    font: inherit; font-size: 19px; font-weight: bold; color: #fff8e7; cursor: pointer;
    background: none; border: 2px dashed transparent; border-radius: 8px; padding: 2px 6px;
    text-shadow: 2px 2px 0 var(--madeira-escura); white-space: nowrap; max-width: 320px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .nome-fazenda:hover { border-color: #e0b27a; }
  .nome-fazenda .lapis { font-size: 13px; opacity: .8; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .stat {
    background: var(--papel); color: var(--texto);
    border: 3px solid var(--madeira-escura); border-radius: 10px;
    padding: 3px 9px; font-weight: bold; white-space: nowrap;
    box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .stat.moedas { background: #fff1b8; font-size: 19px; min-width: 140px; text-align: center; }
  .stat small { font-weight: normal; opacity: .8; }
  .stat.estacao { position: relative; overflow: hidden; }
  .stat.estacao .fio { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--verde); }
  .botoes-topo { display: flex; gap: 5px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: bold; cursor: pointer;
    border: 3px solid var(--madeira-escura); border-radius: 10px;
    padding: 4px 10px; background: var(--papel); color: var(--texto);
    box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--madeira-escura); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.icone { min-width: 40px; padding: 4px 6px; }
  .btn.perigo { background: #ffd6cf; }
  .btn.verde { background: #d9f5c8; }
  .btn.desligado { background: #ddd2bd; color: #8a7a66; }
  .btn.mini { padding: 1px 8px; font-size: 12px; border-width: 2px; box-shadow: 0 2px 0 var(--madeira-escura); }

  /* Objetivo do nível, sempre visível */
  .objetivo {
    position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 5px 12px 7px; background: #6e4524; border-top: 2px solid var(--madeira-escura); font-size: 14px;
  }
  .objetivo .nivel {
    background: var(--ouro); color: #5a3a00; font-weight: bold; border-radius: 8px; padding: 1px 8px;
    border: 2px solid #8a6408; white-space: nowrap;
  }
  .objetivo .obj-txt { flex: 1 1 260px; min-width: 0; }
  .objetivo .barra { flex: 0 1 220px; min-width: 120px; height: 12px; background: #4a2c14; border: 2px solid #2e1a0a; border-radius: 8px; overflow: hidden; }
  .objetivo .barra > div { height: 100%; width: 0; background: repeating-linear-gradient(45deg, #7fd15a 0 8px, #6cc24a 8px 16px); transition: width .4s; }
  .objetivo .obj-cont { font-weight: bold; white-space: nowrap; }
  .metas {
    position: absolute; right: 12px; top: 100%; z-index: 40; width: min(420px, 94vw);
    background: var(--papel); color: var(--texto); border: 3px solid var(--madeira); border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .metas h3 { margin: 0 0 6px; font-size: 15px; }
  .metas ul { list-style: none; margin: 0; padding: 0; }
  .metas li { padding: 4px 0; border-bottom: 1px dashed #d8c8a8; font-size: 14px; display: flex; gap: 6px; align-items: baseline; }
  .metas li:last-child { border-bottom: none; }
  .metas li.ok { color: var(--verde-escuro); text-decoration: line-through; }
  .metas .rec { margin-top: 8px; font-size: 13px; background: #fff1b8; border-radius: 8px; padding: 6px 8px; }

  /* ---------- Layout principal ---------- */
  main {
    display: flex; gap: 14px; align-items: flex-start;
    max-width: 1500px; margin: 0 auto; padding: 14px;
  }
  .painel {
    background: var(--papel);
    border: 4px solid var(--madeira); border-radius: 14px;
    box-shadow: 0 5px 0 var(--madeira-escura);
  }
  .fazenda-col { flex: 1.9; min-width: 0; }
  .lateral { flex: 1; min-width: 320px; max-width: 460px; }
  main.sem-lateral .lateral { display: none; }
  main.sem-lateral .fazenda-col { flex: 1; }

  .fazenda-wrap { position: relative; padding: 8px 8px 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
  canvas#fazenda {
    display: block; width: 100%; height: auto; aspect-ratio: 800 / 560;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 8px; cursor: grab; touch-action: none;
  }
  canvas#fazenda.arrastando { cursor: grabbing; }
  .barra-ferramentas { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px 10px; }
  .dica-camera { font-size: 12px; opacity: .75; margin-left: auto; }

  /* Avisos no céu: um de cada vez, sem cobrir a fazenda */
  .ceu { position: absolute; left: 8px; right: 8px; top: 8px; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .ceu-msg {
    max-width: 92%; padding: 3px 14px; border-radius: 12px; font-weight: bold; text-align: center;
    background: rgba(255, 252, 240, .93); border: 2px solid var(--madeira); color: var(--texto);
    font-size: clamp(11px, 1.35vw, 16px); line-height: 1.25;
    box-shadow: 0 2px 0 var(--madeira-escura);
    animation: entraCeu .35s ease-out;
  }
  .ceu-msg.conquista { background: linear-gradient(#fff6c8, #ffe58a); border-color: #b8860b; }
  .ceu-msg.nivel { background: linear-gradient(#e8ffd8, #bff09a); border-color: var(--verde-escuro); }
  .ceu-msg.alerta { background: #ffe9e4; border-color: #c0392b; }
  .ceu-msg small { font-weight: normal; opacity: .85; }
  .ceu-msg.saindo { animation: saiCeu .3s ease-in forwards; }
  @keyframes entraCeu { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @keyframes saiCeu { to { opacity: 0; transform: translateY(-8px); } }

  /* Rótulos presos ao mundo (contadores, placas) */
  .rotulos { position: absolute; left: 8px; right: 8px; top: 8px; pointer-events: none; overflow: hidden; border-radius: 8px; }
  .rot {
    position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
    background: rgba(255, 248, 231, .92); color: var(--texto);
    border: 2px solid var(--madeira-escura); border-radius: 8px;
    padding: 0 5px; font-size: clamp(9px, 1.1vw, 13px); font-weight: bold;
    box-shadow: 0 2px 0 var(--madeira-escura);
  }
  .rot.placa { background: #c8955a; color: #fff8e7; border-color: #5e3b1a; text-shadow: 1px 1px 0 #5e3b1a; }
  .rot.nome-placa { background: #a0703f; color: #fff8e7; }

  .flutua {
    position: absolute; pointer-events: none; z-index: 5;
    font-weight: bold; font-size: 20px; color: #ffe066;
    text-shadow: 2px 2px 0 #7a4a12, -1px -1px 0 #7a4a12, 1px -1px 0 #7a4a12, -1px 1px 0 #7a4a12;
    transform: translate(-50%, -50%); animation: sobe .9s ease-out forwards; white-space: nowrap;
  }
  .flutua.coracao { color: #ff6f91; text-shadow: 1px 1px 0 #7a1a32; }
  @keyframes sobe {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.7); }
    20% { transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -260%) scale(1); }
  }

  /* ---------- Lateral: painéis ---------- */
  .paineis { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 4px; border-bottom: 3px solid var(--papel-escuro); }
  .paineis button {
    position: relative; flex: 1 1 auto; cursor: pointer; font-weight: bold; font-size: 13px;
    padding: 6px 6px; border-radius: 9px; border: 2px solid var(--madeira); background: var(--papel-escuro); color: var(--texto);
  }
  .paineis button.ativo { background: var(--madeira); color: #fff8e7; }
  .ponto {
    position: absolute; top: -5px; right: -5px; width: 12px; height: 12px;
    border-radius: 50%; background: #ff5a4f; border: 2px solid #fff8e7; display: none;
  }
  .ponto.on { display: block; }
  #conteudo { padding: 8px 10px 12px; max-height: calc(100vh - 190px); overflow-y: auto; }
  .abas { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .aba {
    position: relative; flex: 1 1 auto; cursor: pointer; font-weight: bold; font-size: 12px;
    padding: 5px 6px; border-radius: 8px; border: 2px solid var(--madeira); background: #fffdf5; color: var(--texto);
  }
  .aba.ativa { background: var(--verde); border-color: var(--verde-escuro); color: #fff; }
  .lista { display: flex; flex-direction: column; gap: 8px; }
  .subtitulo { font-weight: bold; font-size: 13px; margin: 6px 2px 0; opacity: .8; }

  .item {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: #fffdf5; border: 3px solid var(--madeira); border-radius: 10px;
    padding: 7px 9px; box-shadow: 0 3px 0 var(--madeira-escura);
  }
  .item .ico { font-size: 28px; width: 38px; text-align: center; flex-shrink: 0; }
  .item .info { flex: 1; min-width: 0; }
  .item .nome { font-weight: bold; font-size: 15px; }
  .item .qtd { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 6px; background: var(--verde); color: #fff; font-size: 12px; vertical-align: middle; }
  .item .tier { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 6px; background: #b08458; color: #fff; font-size: 11px; vertical-align: middle; }
  .item .desc { font-size: 12px; opacity: .85; margin-top: 2px; }
  .item .efeito { font-size: 12px; color: var(--verde-escuro); font-weight: bold; margin-top: 2px; }
  .item .custo-extra { font-size: 12px; margin-top: 2px; }
  .item .custo-extra .falta { color: #b03a2e; font-weight: bold; }
  .compras { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .comprar {
    cursor: pointer; font-weight: bold; font-size: 12px; white-space: nowrap;
    background: #fff1b8; border: 2px solid #c99a2e; border-radius: 8px; padding: 2px 7px; color: var(--texto);
  }
  .comprar:hover:not(:disabled) { background: #ffe58a; }
  .comprar:active:not(:disabled) { transform: translateY(1px); }
  .comprar:disabled { background: #f3e2df; border-color: #c98a80; color: #a0453a; cursor: not-allowed; }
  .item.bloqueado { background: #ece3cf; filter: grayscale(.7); opacity: .8; box-shadow: none; }
  .item.misterio .ico { filter: brightness(0); opacity: .35; }
  .item.feito { background: #e7f6dc; border-color: var(--verde-escuro); box-shadow: none; padding: 4px 8px; }
  .item.feito .ico { font-size: 20px; width: 28px; }
  .item.feito .desc, .item.feito .efeito { display: none; }
  .selo { font-size: 12px; font-weight: bold; border-radius: 8px; padding: 2px 7px; white-space: nowrap; background: #ddd; border: 2px solid #aaa; }
  .selo.ok { background: var(--verde); border-color: var(--verde-escuro); color: #fff; }
  .vazio { text-align: center; padding: 10px; font-weight: bold; opacity: .8; }
  details.concluidos { border: 3px dashed var(--madeira); border-radius: 10px; background: var(--papel-escuro); }
  details.concluidos summary { cursor: pointer; padding: 8px 12px; font-weight: bold; list-style: none; user-select: none; }
  details.concluidos summary::-webkit-details-marker { display: none; }
  details.concluidos summary::before { content: '▶ '; font-size: 11px; }
  details.concluidos[open] summary::before { content: '▼ '; }
  details.concluidos .lista { padding: 0 8px 8px; gap: 5px; }

  /* Armazém */
  .caixa-info { background: #fff1b8; border: 2px solid #c99a2e; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .caixa-info b { font-size: 14px; }
  .cap { height: 12px; background: #e9dcc0; border-radius: 6px; overflow: hidden; border: 2px solid var(--madeira); margin-top: 4px; }
  .cap > div { height: 100%; background: #5aa8e0; }
  .encomenda { background: #fff; border: 3px solid #c0392b; border-radius: 10px; padding: 8px 10px; }
  .encomenda h4 { margin: 0 0 4px; font-size: 15px; }
  .encomenda .linha-enc { font-size: 13px; margin-top: 4px; }
  .encomenda .mini { height: 8px; background: #eadbd8; border-radius: 4px; overflow: hidden; margin-top: 2px; }
  .encomenda .mini > div { height: 100%; background: #e06a4f; }
  .encomenda.pausada { border-color: #999; opacity: .85; }
  .prod {
    display: grid; grid-template-columns: 30px 1fr auto; gap: 2px 8px; align-items: center;
    background: #fffdf5; border: 2px solid #d8c8a8; border-radius: 9px; padding: 5px 8px;
  }
  .prod .pi { font-size: 22px; grid-row: span 2; text-align: center; }
  .prod .pn { font-weight: bold; font-size: 14px; }
  .prod .ps { font-size: 12px; opacity: .8; }
  .prod .pb { grid-row: span 2; display: flex; flex-direction: column; gap: 3px; align-items: stretch; }
  .alternar { display: flex; border: 2px solid var(--madeira); border-radius: 8px; overflow: hidden; }
  .alternar button { cursor: pointer; font-size: 11px; font-weight: bold; border: none; padding: 2px 7px; background: #fffdf5; color: var(--texto); }
  .alternar button.on { background: var(--madeira); color: #fff; }
  .alternar button.reservado { background: #e06a4f; color: #fff; }

  /* Habilidades */
  .arvore-topo { text-align: center; font-weight: bold; margin-bottom: 6px; }
  .pontos-hab { display: inline-block; background: var(--ouro); border: 2px solid #8a6408; border-radius: 10px; padding: 2px 10px; }
  .arvore { position: relative; width: 100%; aspect-ratio: 5 / 6.4; margin: 4px 0 8px;
    background: radial-gradient(ellipse at 50% 100%, #e6d2a8 0, #f6ead0 60%, #fff8e7 100%); border-radius: 12px; border: 2px solid #d8c8a8; }
  .arvore svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arvore .tronco { stroke: #8b5a2b; stroke-width: 10; stroke-linecap: round; fill: none; }
  .arvore .galho { stroke: #b8a284; stroke-width: 4; stroke-linecap: round; fill: none; transition: stroke .4s; }
  .arvore .galho.aceso { stroke: #f5c542; filter: drop-shadow(0 0 3px #ffd84a); }
  .arvore .galho.acendendo { stroke-dasharray: 120; stroke-dashoffset: 120; animation: acende .7s ease-out forwards; stroke: #ffd84a; }
  @keyframes acende { to { stroke-dashoffset: 0; } }
  .no {
    position: absolute; transform: translate(-50%, -50%); width: 15%; aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: clamp(14px, 2vw, 22px); cursor: pointer;
    background: #e6dccb; border: 3px solid #a8987e; filter: grayscale(.8); transition: transform .15s;
  }
  .no:hover { transform: translate(-50%, -50%) scale(1.08); }
  .no.disponivel { filter: none; background: #fff6d8; border-color: var(--ouro); animation: brilha 1.6s ease-in-out infinite; }
  .no.ativo { filter: none; background: #ffe58a; border-color: #b8860b; box-shadow: 0 0 10px #ffd84a; }
  .no.selecionado { outline: 3px solid var(--verde); outline-offset: 2px; }
  .no.explode { animation: explode .6s ease-out; }
  @keyframes brilha { 50% { box-shadow: 0 0 12px #ffd84a; } }
  @keyframes explode { 0% { transform: translate(-50%, -50%) scale(1); } 40% { transform: translate(-50%, -50%) scale(1.45); box-shadow: 0 0 30px #fff3a0; } 100% { transform: translate(-50%, -50%) scale(1); } }
  .rotulo-galho { position: absolute; bottom: 1.5%; transform: translateX(-50%); font-size: 11px; font-weight: bold; text-align: center; width: 19%; }
  .faisca { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffe066; pointer-events: none; animation: faisca .8s ease-out forwards; }
  @keyframes faisca { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
  .detalhe-hab { background: #fffdf5; border: 3px solid var(--madeira); border-radius: 10px; padding: 8px 10px; }
  .detalhe-hab h4 { margin: 0 0 4px; }

  /* Equipe */
  .pessoa { display: grid; grid-template-columns: 40px 1fr; gap: 4px 8px; align-items: center; background: #fffdf5; border: 3px solid var(--madeira); border-radius: 10px; padding: 7px 9px; }
  .pessoa .av { font-size: 28px; grid-row: span 2; text-align: center; }
  .pessoa .pnome { font-weight: bold; }
  .pessoa .acoes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .pessoa select, .contratar select { font: inherit; font-size: 13px; border: 2px solid var(--madeira); border-radius: 6px; background: #fff; padding: 1px 4px; }
  .contratar { background: #e7f6dc; border: 3px dashed var(--verde-escuro); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .funcoes { font-size: 12px; background: #fff; border-radius: 8px; padding: 6px 8px; border: 1px solid #d8c8a8; }

  /* Conquistas */
  .cq-resumo { text-align: center; font-weight: bold; padding: 8px; border-radius: 10px; background: #fff1b8; border: 2px solid #c99a2e; }
  .cq-resumo small { display: block; font-weight: normal; font-size: 12px; }
  .cq-perto { background: #e7f6dc; border: 2px solid var(--verde-escuro); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .cq { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border: 3px solid #b8a284; border-radius: 10px; background: #ece3cf; }
  .cq .ico { font-size: 24px; width: 34px; text-align: center; flex-shrink: 0; }
  .cq .info { flex: 1; min-width: 0; }
  .cq .nome { font-weight: bold; font-size: 14px; }
  .cq .desc { font-size: 12px; opacity: .85; }
  .cq .bonus { font-weight: bold; font-size: 12px; white-space: nowrap; color: var(--verde-escuro); text-align: right; }
  .cq.ok.bronze { background: linear-gradient(#fff3e6, #f2d2b0); border-color: #b87333; }
  .cq.ok.prata { background: linear-gradient(#ffffff, #dfe4ea); border-color: #8d98a6; }
  .cq.ok.ouro { background: linear-gradient(#fffbe6, #ffe58a); border-color: #c99a2e; box-shadow: 0 2px 0 #a07a1a; }
  .cq .mini { height: 6px; margin-top: 3px; background: #d8ccb2; border-radius: 4px; overflow: hidden; }
  .cq .mini > div { height: 100%; background: var(--verde); }
  .cq .prog { font-size: 11px; opacity: .8; }
  .medalha { font-size: 11px; font-weight: bold; padding: 0 5px; border-radius: 6px; color: #fff; }
  .medalha.bronze { background: #b87333; } .medalha.prata { background: #8d98a6; } .medalha.ouro { background: #c99a2e; }

  /* Mina */
  .mina { position: absolute; left: 8px; right: 8px; top: 8px; aspect-ratio: 800 / 560; background: #2a1d14; border-radius: 8px; display: flex; flex-direction: column; z-index: 8; }
  .mina-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 10px; color: #fff3dc; font-weight: bold; background: #3d2a1c; border-radius: 8px 8px 0 0; }
  .mina-topo .esp { flex: 1; }
  .mina-topo .minerios { font-size: 13px; font-weight: normal; }
  .mina canvas { flex: 1; width: 100%; min-height: 0; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }

  /* Tutorial e modais */
  .balao {
    position: fixed; z-index: 90; max-width: 280px; background: #fffdf2; color: var(--texto);
    border: 3px solid var(--verde-escuro); border-radius: 12px; padding: 9px 12px; font-size: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.28); pointer-events: auto;
  }
  .balao b { display: block; margin-bottom: 3px; }
  .balao .seta { position: absolute; width: 0; height: 0; border: 10px solid transparent; }
  .balao .acoes-balao { display: flex; gap: 6px; justify-content: flex-end; margin-top: 7px; }
  .alvo-tutorial { outline: 4px solid #ffd84a !important; outline-offset: 2px; animation: pisca 1s ease-in-out infinite; }
  @keyframes pisca { 50% { outline-color: #ff9a3c; } }

  .modal { position: fixed; inset: 0; background: rgba(40, 25, 10, .55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal.aberto { display: flex; }

let config = { musica: true, efeitos: true, fundador: false };
let versaoNova = false; // jogador tinha um save da versão antiga

function carregar() {
  try { Object.assign(config, JSON.parse(localStorage.getItem(CHAVE_CONFIG) || '{}')); } catch (e) {}
  try {
    const bruto = localStorage.getItem(CHAVE_SAVE);
    if (bruto) {
      const d = JSON.parse(bruto);
      estado = Object.assign(novoEstado(), d);
      estado.contadores = Object.assign(novosContadores(), d.contadores || {});
      estado.tutorial = Object.assign({ passo: 0, pulou: false }, d.tutorial || {});
      return true;
    }
  } catch (e) { estado = novoEstado(); }
  // save de uma versão antiga: o progresso recomeça (com aviso ao jogador)
  for (const k of CHAVES_ANTIGAS) {
    try {
      if (localStorage.getItem(k)) { versaoNova = true; config.fundador = true; localStorage.removeItem(k); salvarConfig(); }
    } catch (e) {}
  }
  return false;
}
function salvar() {
  estado.salvoEm = Date.now();
  try { localStorage.setItem(CHAVE_SAVE, JSON.stringify(estado)); } catch (e) {}
}
function salvarConfig() {
  try { localStorage.setItem(CHAVE_CONFIG, JSON.stringify(config)); } catch (e) {}
}

const fracEstacao = () => (estado.tempo % DURACAO_ESTACAO) / DURACAO_ESTACAO;
const anoAtual = () => Math.floor(estado.tempo / (DURACAO_ESTACAO * 4)) + 1;
const inverno = () => estacao() === 3;

function tierLinha(linha) {
  const l = LINHAS[linha];
  if (!l) return 0;
  for (let t = l.length - 1; t >= 1; t--) if (l[t] && tem(l[t].id)) return t;
  return 0;
}
function dadoLinha(linha) { const t = tierLinha(linha); return t ? LINHAS[linha][t] : LINHA_BASE[linha]; }
function ferramentasNoTier(t) { return ['enxada', 'regador', 'balde', 'picareta'].filter(l => tierLinha(l) >= t).length; }
const capEstufa = () => dadoLinha('estufa').cap || 0;
const capArmazem = () => dadoLinha('armazem').cap;
function vagasEquipe() {
  let v = 0;
  for (const n in VAGAS_NIVEL) if (estado.nivel >= Number(n)) v = Math.max(v, VAGAS_NIVEL[n]);
  if (tem('cabana')) v += 1;
  if (hab('e3')) v += 1;
  return v;
}
function andarMaximo() {
  let lim = 0;
  for (const n in ANDARES_POR_NIVEL) if (estado.nivel >= Number(n)) lim = Math.max(lim, ANDARES_POR_NIVEL[n]);
  return Math.min(lim, dadoLinha('picareta').fundo);
}

// ---------- Multiplicadores ----------
function bonusConquistas() {
  let pct = 0;
  for (const c of CONQUISTAS) if (estado.conquistas[c.id]) pct += BONUS_MEDALHA[c.medalha];
  return 1 + pct / 100;
}
const bonusEncomendas = () => 1 + encomendasFeitas() * (hab('c2') ? 0.075 : 0.05);
const bonusGlobal = () => bonusConquistas() * bonusEncomendas() * (tem('casarao') ? 1.1 : 1);
const multEquipe = () => (hab('e1') ? 1.15 : 1) * (hab('e2') ? 1.2 : 1) * (hab('e4') ? 1.5 : 1);

function fatorEstacao(item, est) {
  const fav = item.favor && item.favor.includes(est) ? (hab('a3') ? 2 : 1.5) : 1;
  if (item.planta === 'estufa') return est === 3 ? 1.25 * (hab('a4') ? 1.5 : 1) : fav;
  if (item.planta === 'inverno') return est === 3 ? (hab('a3') ? 2 : 1.5) : [0.6, 0.5, 0.8][est];
  if (est === 3) return Math.min(0.7, 0.25 + 0.15 * contarFuncao('jardineiro') * multEquipe());
  return fav;
}
// Fração da produção dos animais de um abrigo no inverno (quem não cabe produz 50%)
function fatorCasa(casa, est) {
  if (est !== 3) return 1;
  const n = PRODUTORES.filter(i => i.casa === casa).reduce((s, i) => s + qtd(i.id), 0);
  if (!n) return 1;
  const abrigados = Math.min(n, dadoLinha(casa).cap || 0);
  return (abrigados * (hab('p4') ? 1.3 : 1) + (n - abrigados) * 0.5) / n;
}
function animaisAbrigados(casa) {
  const n = PRODUTORES.filter(i => i.casa === casa).reduce((s, i) => s + qtd(i.id), 0);
  return [Math.min(n, dadoLinha(casa).cap || 0), n];
}
function multPlantas() {
  return (1 + dadoLinha('regador').bonus) * (hab('a1') ? 1.15 : 1) * (hab('a2') ? 1.1 : 1) * (hab('a5') ? 1.5 : 1)
    * (1 + 0.15 * contarFuncao('colheita') * multEquipe());
}
function multAnimais() {
  return (1 + dadoLinha('balde').bonus) * (hab('p1') ? 1.15 : 1) * (hab('p2') && (tem('cachorro') || tem('gato')) ? 1.2 : 1)
    * (hab('p5') ? 1.5 : 1) * (1 + 0.15 * contarFuncao('tratador') * multEquipe());
}
function precoVenda(p) {
  const d = PRODUTOS[p];
  let v = d.preco;
  if (d.art) { if (hab('r4')) v *= 1.2; if ((p === 'queijo' || p === 'geleia') && hab('r2')) v *= 1.25; }
  else if (hab('c4')) v *= 1.2;
  if (hab('c1')) v *= 1.1;
  if (hab('c5')) v *= 1.25;
  return v * (1 + 0.1 * contarFuncao('feirante') * multEquipe());
}

// Fluxo de produção em unidades por segundo, já com as transformadoras
let fluxo = { prod: {}, diretas: 0 };
let rendaPotencial = 0; // moedas/s se tudo fosse vendido
let rendaAtual = 0;     // moedas/s de verdade (descontando o que vai para o armazém)
function calcularFluxos() {
  const est = estacao(), g = bonusGlobal(), mP = multPlantas(), mA = multAnimais();
  const fc = { galinheiro: fatorCasa('galinheiro', est), celeiro: fatorCasa('celeiro', est), estabulo: fatorCasa('estabulo', est) };
  const flores = 1 + 0.3 * contarFuncao('jardineiro') * multEquipe();
  const prod = {};
  let diretas = 0;
  for (const it of PRODUTORES) {
    const n = qtd(it.id);
    if (!n) continue;
    let r = n * it.renda * g;
    if (it.cat === 'plantacoes') { r *= mP * fatorEstacao(it, est); if (it.produz === 'flores') r *= flores; }
    else { r *= mA * (it.casa ? fc[it.casa] : 1); if ((it.produz === 'leite' || it.produz === 'la') && hab('p3')) r *= 1.25; }
    if (!it.produz) { diretas += r; continue; }
    prod[it.produz] = (prod[it.produz] || 0) + r / PRODUTOS[it.produz].preco;
  }
  for (const t of TRANSFORMADORAS) {
    const tier = tierLinha(t.linha);
    if (!tier) continue;
    const pct = t.pct[tier - 1];
    let usado = 0;
    for (const p of t.de) { if (!prod[p]) continue; const u = prod[p] * pct; prod[p] -= u; usado += u; }
    if (!usado) continue;
    let saida = usado / t.razao * (hab('r5') ? 1.5 : 1);
    if (t.para === 'farinha' && hab('r1')) saida *= 1.25;
    if (t.para === 'tecido' && hab('r3')) saida *= 1.3;
    prod[t.para] = (prod[t.para] || 0) + saida;
  }
  fluxo = { prod, diretas };
  rendaPotencial = diretas;
  for (const p in prod) rendaPotencial += prod[p] * precoVenda(p);
  return fluxo;
}

function valorClique() {
  const e = dadoLinha('enxada');
  return Math.max(1, Math.floor(e.clique * (dadoLinha('casa').clique || 1) + rendaPotencial * e.pct));
}
function ganhar(v) { estado.moedas += v; estado.ganhoTotal += v; }

// ---------- Armazém ----------
const totalEstoque = () => Object.values(estado.estoque).reduce((s, n) => s + n, 0);
function faltaEncomenda(p) {
  let falta = 0;
  for (const e of ENCOMENDAS) {
    const s = estado.encomendas[e.id];
    if (s && s.status === 'ativa' && pedidoDe(e)[p]) falta += pedidoDe(e)[p];
  }
  return Math.max(0, falta - (estado.estoque[p] || 0));
}
function reservadoEncomenda(p) {
  let r = 0;
  for (const e of ENCOMENDAS) {
    const s = estado.encomendas[e.id];
    if (s && s.status !== 'feita' && pedidoDe(e)[p]) r += pedidoDe(e)[p];
  }
  return Math.min(r, estado.estoque[p] || 0);
}
function venderEstoque(p) {
  const n = (estado.estoque[p] || 0) - reservadoEncomenda(p);
  if (n < 1) return 0;
  const v = Math.floor(n) * precoVenda(p);
  estado.estoque[p] -= Math.floor(n);
  ganhar(v);
  return v;
}
function venderMinerio(m, n) {
  n = Math.min(n, estado.minerios[m] || 0);
  if (n < 1) return 0;
  estado.minerios[m] -= n;
  const v = n * MINERIOS[m].preco;
  ganhar(v);
  return v;
}
function addMinerio(m, n = 1) {
  estado.minerios[m] = (estado.minerios[m] || 0) + n;
  estado.minerado[m] = (estado.minerado[m] || 0) + n;
}

// ---------- Encomendas ----------
const prazoEncomenda = e => e.prazo * (hab('c3') ? 1.5 : 1);
const PARTE_ENCOMENDA = 0.3;
const ENCHE_ENCOMENDA = 240; // segundos para encher um pedido sem "Guardar"
function pedidoTotal(p) {
  let t = 0;
  for (const e of ENCOMENDAS) { const s = estado.encomendas[e.id]; if (s && s.status === 'ativa' && pedidoDe(e)[p]) t += pedidoDe(e)[p]; }
  return t;
}
// O pedido cresce junto com a fazenda: ~2,5 minutos da produção atual (nunca menos que o pedido base)
function quantidadesEncomenda(e) {
  const r = {};
  for (const [p, base] of Object.entries(e.pede)) {
    const alvo = (fluxo.prod[p] || 0) * 150;
    const redondo = alvo < 100 ? Math.ceil(alvo / 5) * 5 : alvo < 1000 ? Math.ceil(alvo / 50) * 50 : Math.ceil(alvo / 500) * 500;
    // nunca pede mais do que cabe no armazém (divide o espaço entre os produtos do pedido)
    const espaco = Math.floor(capArmazem() * 0.6 / Object.keys(e.pede).length);
    r[p] = Math.max(base, Math.min(redondo, espaco));
  }
  return r;
}
const pedidoDe = e => (estado.encomendas[e.id] && estado.encomendas[e.id].pede) || e.pede;
function atualizarEncomendas() {
  for (const e of ENCOMENDAS) {
    const s = estado.encomendas[e.id];
    if (!s) {
      if (estado.nivel >= e.nivel && tierLinha(e.linha) && (!e.linha2 || tierLinha(e.linha2))) {
        estado.encomendas[e.id] = { status: 'ativa', fim: estado.tempo + prazoEncomenda(e), pede: quantidadesEncomenda(e) };
        emitir('encomenda', e);
      }
      continue;
    }
    if (s.status === 'ativa') {
      if (Object.entries(pedidoDe(e)).every(([p, n]) => (estado.estoque[p] || 0) >= n)) entregarEncomenda(e);
      else if (estado.tempo > s.fim) { s.status = 'pausada'; s.volta = estado.tempo + VOLTA_ENCOMENDA; emitir('encomendaPausa', e); }
    } else if (s.status === 'pausada' && estado.tempo >= s.volta) {
      s.status = 'ativa'; s.fim = estado.tempo + prazoEncomenda(e);
      emitir('encomendaVolta', e);
    }
  }
}
function entregarEncomenda(e) {
  for (const [p, n] of Object.entries(pedidoDe(e))) estado.estoque[p] -= n;
  estado.encomendas[e.id].status = 'feita';
  estado.pontos += 1;
  const moedas = Math.floor(Math.max(500, rendaPotencial * 120) * (hab('c2') ? 1.5 : 1));
  ganhar(moedas);
  emitir('encomendaFeita', { e, moedas });
}

// ---------- Obras (limpezas e construções levam um tempo para ficar prontas) ----------
const DURACAO_OBRA_NIVEL = [0, 30, 90, 110, 140, 170, 200, 230, 260, 290, 320];
const precisaObra = item => item.cat === 'limpeza' || item.cat === 'construcoes' && !item.pet;
const duracaoObra = item => item.obraT || DURACAO_OBRA_NIVEL[item.nivel];
const SEG_POR_CLIQUE_OBRA = 0.25; // cada clique na fazenda adianta a obra
function iniciarObra(item) {
  const d = duracaoObra(item);
  estado.obra = { id: item.id, inicio: estado.tempo, fim: estado.tempo + d, total: d };
}
function progressoObra() {
  const o = estado.obra;
  if (!o) return 0;
  return Math.min(1, 1 - (o.fim - estado.tempo) / o.total);
}
function adiantarObra(seg) { if (estado.obra) estado.obra.fim -= seg; }
function concluirObra() {
  const item = ITEM[estado.obra.id];
  estado.obra = null;
  estado.itens[item.id] = 1;
  calcularFluxos();
  emitir('obraPronta', item);
}

// ---------- Avanço do tempo ----------
function tick(dt) {
  if (dt <= 0) return;
  if (estado.obra && estado.tempo + dt >= estado.obra.fim) { estado.tempo = Math.max(estado.tempo, estado.obra.fim); concluirObra(); }
  const estAntes = estacao();
  estado.tempo += dt;
  const estDepois = estacao();
  if (estDepois !== estAntes) {
    if (estAntes === 3) estado.contadores.invernos++;
    emitir('estacao', estDepois);
  }
  calcularFluxos();
  const cap = capArmazem();
  let usado = totalEstoque();
  let moedasSeg = fluxo.diretas;
  for (const p in fluxo.prod) {
    const u = fluxo.prod[p] * dt;
    if (u <= 0) continue;
    estado.produzido[p] = (estado.produzido[p] || 0) + u;
    if (estDepois === 3 && (p === 'couve' || p === 'repolho')) estado.contadores.colheitaInverno += u;
    const falta = faltaEncomenda(p);
    let guardado = 0;
    if (estado.guardar[p] || falta > 0) {
      guardado = Math.min(u, Math.max(0, cap - usado));
      // sem "Guardar", a encomenda recebe só uma parte da produção (o resto continua sendo vendido)
      // e enche em uns 4 minutos; com "Guardar" vai tudo para o armazém e enche bem mais rápido
      if (!estado.guardar[p]) guardado = Math.min(guardado, falta, u * PARTE_ENCOMENDA, pedidoTotal(p) / ENCHE_ENCOMENDA * dt);
      estado.estoque[p] = (estado.estoque[p] || 0) + guardado;
      usado += guardado;
    }
    moedasSeg += (u - guardado) / dt * precoVenda(p); // o excedente é vendido na hora
  }
  ganhar(moedasSeg * dt);
  rendaAtual = moedasSeg;
  // mineradores contratados
  const mineradores = contarFuncao('minerador');
  if (mineradores && tem('minaEntrada')) {
    estado.minaAcum += dt / 60 * MINERIOS_POR_MINUTO * mineradores * (hab('e5') ? 2 : 1) * multEquipe();
    while (estado.minaAcum >= 1) {
      estado.minaAcum -= 1;
      addMinerio(sorteioPesado(minerioDoAndar(Math.max(1, Math.min(estado.minaFundo, andarMaximo() || 1)))));
    }
  }
  atualizarEncomendas();
}

// ---------- Níveis ----------
function metasDoProximo() { return estado.nivel < NIVEL_MAX ? NIVEIS[estado.nivel + 1].metas : []; }
function metaFeita(m) { const [a, b] = m.p(); return a >= b; }
function verificarNivel() {
  let subiu = false;
  while (estado.nivel < NIVEL_MAX && metasDoProximo().every(metaFeita)) {
    estado.nivel++;
    estado.pontos += PONTOS_POR_NIVEL;
    subiu = true;
    emitir('nivel', estado.nivel);
  }
  return subiu;
}

// ---------- Conquistas ----------
function progressoConquista(c) { const [a, b] = c.prog(); return [Math.min(a, b), b]; }
function verificarConquistas(silencioso) {
  const novas = [];
  for (const c of CONQUISTAS) {
    if (estado.conquistas[c.id]) continue;
    const [a, b] = c.prog();
    if (a >= b) { estado.conquistas[c.id] = Date.now(); if (c.ponto) estado.pontos += 1; novas.push(c); }
  }
  if (novas.length) emitir('conquistas', { novas, silencioso });
  return novas;
}

// ---------- Loja ----------
function liberado(item) {
  if (item.nivel > estado.nivel) return false;
  if (item.req && !item.req.every(([id, n]) => qtd(id) >= n)) return false;
  if (item.linha && item.tier !== tierLinha(item.linha) + 1) return false;
  return true;
}
function custoDe(item) {
  return item.repetivel ? Math.floor(item.custo * Math.pow(item.cresc, qtd(item.id))) : item.custo;
}
function custoLote(item, n) {
  if (!item.repetivel) return item.custo;
  const k = qtd(item.id);
  let total = 0;
  for (let i = 0; i < n; i++) total += Math.floor(item.custo * Math.pow(item.cresc, k + i));
  return total;
}
function temMinerios(item) {
  return !item.minerios || Object.entries(item.minerios).every(([m, n]) => (estado.minerios[m] || 0) >= n);
}
function limiteCapacidade(item) {
  if (item.planta === 'estufa') return Math.max(0, capEstufa() - qtd('tomate') - qtd('morango'));
  return Infinity;
}
// Quantas unidades o jogador consegue comprar agora
function maxAcessivel(item) {
  if (!liberado(item)) return 0;
  if (!item.repetivel) return (tem(item.id) || estado.moedas < item.custo || !temMinerios(item) || (precisaObra(item) && estado.obra)) ? 0 : 1;
  const lim = limiteCapacidade(item);
  if (lim <= 0) return 0;
  const r = item.cresc, base = item.custo * Math.pow(r, qtd(item.id));
  if (!(estado.moedas >= Math.floor(base))) return 0;
  let n = Math.floor(Math.log(estado.moedas * (r - 1) / base + 1) / Math.log(r));
  n = Math.max(1, Math.min(n, 5000, lim));
  while (n > 1 && custoLote(item, n) > estado.moedas) n--;
  while (n < Math.min(5000, lim) && custoLote(item, n + 1) <= estado.moedas) n++;
  return n;
}
function comprar(item, n = 1) {
  if (!liberado(item)) return false;
  if (!item.repetivel) n = 1;
  if (n < 1 || n > maxAcessivel(item)) return false;
  const custo = custoLote(item, n);
  estado.moedas -= custo;
  if (item.minerios) for (const [m, k] of Object.entries(item.minerios)) estado.minerios[m] -= k;
  if (precisaObra(item)) { iniciarObra(item); emitir('obraIniciada', item); return true; }
  estado.itens[item.id] = qtd(item.id) + n;
  calcularFluxos();
  return true;
}

// ---------- Habilidades ----------
function habilidadeDisponivel(h) {
  if (hab(h.id)) return false;
  const i = Number(h.id[1]);
  return i === 1 || hab(h.id[0] + (i - 1));
}
function desbloquearHabilidade(h) {
  if (!habilidadeDisponivel(h) || estado.pontos < 1) return false;
  estado.pontos -= 1;
  estado.habilidades[h.id] = Date.now();
  calcularFluxos();
  return true;
}

// ---------- Equipe ----------
const custoContrato = () => CUSTO_CONTRATO[Math.min(estado.equipe.length, CUSTO_CONTRATO.length - 1)];
function contratar(funcao) {
  if (estado.equipe.length >= vagasEquipe() || estado.moedas < custoContrato()) return null;
  estado.moedas -= custoContrato();
  const usados = new Set(estado.equipe.map(p => p.nome));
  const livres = NOMES_PESSOAS.filter(n => !usados.has(n));
  const p = { id: Date.now() + Math.floor(Math.random() * 1000), nome: escolhe(livres.length ? livres : NOMES_PESSOAS), funcao, visual: Math.floor(Math.random() * 1e6) };
  estado.equipe.push(p);
  calcularFluxos();
  return p;
}
function trocarFuncao(id, funcao) {
  const p = estado.equipe.find(x => x.id === id);
  if (!p || p.funcao === funcao) return;
  p.funcao = funcao;
  estado.contadores.trocasFuncao++;
  calcularFluxos();
}
function dispensar(id) { estado.equipe = estado.equipe.filter(p => p.id !== id); calcularFluxos(); }

// ---------- Ganhos enquanto o jogador esteve fora ----------
function simularAusencia(seg) {
  seg = Math.min(seg, 2 * 3600);
  const antes = estado.ganhoTotal;
  while (seg > 0) { const d = Math.min(5, seg); tick(d); seg -= d; }
  return estado.ganhoTotal - antes;
}
// @@FIM_MOTOR@@
// =====================================================================
// SOM (tudo gerado com Web Audio, sem arquivos)
// =====================================================================
const Som = {
  ctx: null, sfx: null, mus: null, eco: null, ruidoBuf: null,

  iniciar() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.connect(ctx.destination);
    const master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
    this.sfx = ctx.createGain(); this.sfx.gain.value = config.efeitos ? 0.6 : 0; this.sfx.connect(master);
    this.mus = ctx.createGain(); this.mus.gain.value = config.musica ? 0.5 : 0; this.mus.connect(master);
    this.eco = ctx.createDelay(1); this.eco.delayTime.value = Musica.passo * 1.5;
    const retorno = ctx.createGain(); retorno.gain.value = 0.3;
    const filtro = ctx.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = 2200;
    const molhado = ctx.createGain(); molhado.gain.value = 0.35;
    this.eco.connect(filtro); filtro.connect(retorno); retorno.connect(this.eco);
    filtro.connect(molhado); molhado.connect(this.mus);
    this.ruidoBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = this.ruidoBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    if (config.musica) Musica.iniciar();
  },
  ajustar() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.sfx.gain.setTargetAtTime(config.efeitos ? 0.6 : 0, t, 0.05);
    this.mus.gain.setTargetAtTime(config.musica ? 0.5 : 0, t, 0.3);
    if (config.musica) Musica.iniciar(); else Musica.parar();
  },
  tom(freq, quando, dur, o = {}) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = o.tipo || 'sine';
    osc.frequency.setValueAtTime(freq, quando);
    if (o.ate) osc.frequency.exponentialRampToValueAtTime(o.ate, quando + dur);
    if (o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();

    g.gain.setValueAtTime(0.0001, quando);
    g.gain.linearRampToValueAtTime(vol, quando + ataque);
    g.gain.exponentialRampToValueAtTime(0.0001, quando + dur);
    let saida = g;
    osc.connect(g);
    if (o.filtro) {
      const f = ctx.createBiquadFilter();
      f.type = o.filtro.tipo; f.frequency.value = o.filtro.freq; f.Q.value = o.filtro.q || 1;
      g.connect(f); saida = f;

const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Musica = {
  passo: 60 / 76 / 2,
  tocando: false, n: 0, proximo: 0, timer: null, nota: 3,
  progressoes: [
    [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]], // primavera: Fmaj7 Em7 Dm7 Cmaj7
    [[48, 52, 55, 59], [53, 57, 60, 64], [55, 59, 62, 65], [52, 55, 59, 62]], // verão: Cmaj7 Fmaj7 G7 Em7
    [[50, 53, 57, 60], [55, 59, 62, 65], [48, 52, 55, 59], [45, 48, 52, 55]], // outono: Dm7 G7 Cmaj7 Am7
    [[45, 48, 52, 55], [53, 57, 60, 64], [48, 52, 55, 59], [52, 55, 59, 62]], // inverno: Am7 Fmaj7 Cmaj7 Em7
  ],
  escala: [67, 69, 72, 74, 76, 79, 81, 84],
  iniciar() {
    if (!Som.ctx || this.tocando) return;
    this.tocando = true;
    this.proximo = Som.ctx.currentTime + 0.15;
    this.timer = setInterval(() => this.agendar(), 100);
  },
  parar() { this.tocando = false; clearInterval(this.timer); },
  agendar() {
    const ctx = Som.ctx;
    if (ctx.state !== 'running') return;
    if (this.proximo < ctx.currentTime - 0.1) this.proximo = ctx.currentTime + 0.05;
    while (this.proximo < ctx.currentTime + 0.4) {
      this.tocarPasso(this.n, this.proximo);
      this.proximo += this.passo * (inverno() ? 1.15 : 1); this.n++;
    }
  },
  tocarPasso(n, t) {
    const compasso = Math.floor(n / 8), dentro = n % 8;
    const acorde = this.progressoes[estacao()][compasso % 4];
    const dest = Som.mus;
    if (dentro === 0) {
      for (const nt of acorde) {
        Som.tom(midi(nt), t, this.passo * 8.6, { vol: 0.03, ataque: 0.7, destino: dest });
        Som.tom(midi(nt + 12), t, this.passo * 8.6, { vol: 0.008, ataque: 0.9, detune: 7, tipo: 'triangle', destino: dest });
      }
    }
    if (dentro === 0 || dentro === 4) {
      const nt = (dentro === 0 ? acorde[0] : acorde[2]) - 12;
      Som.tom(midi(nt), t, this.passo * 3.6, { tipo: 'triangle', vol: 0.1, ataque: 0.02, destino: dest });
    }
    if (dentro % 2 === 1 && !inverno()) Som.ruido(t, 0.05, { filtro: 'highpass', freq: 7000, vol: 0.012, destino: dest });
    const frase = Math.floor(compasso / 4) % 4;
    let prob = dentro % 2 === 0 ? 0.55 : 0.2;
    if (frase === 3) prob *= 0.4;
    if (inverno()) prob *= 0.7;
    if (Math.random() < prob) {
      if (dentro === 0) {
        const alvo = acorde[1 + Math.floor(Math.random() * 3)] + 12;
        this.nota = this.escala.reduce((m, v, i) => Math.abs(v - alvo) < Math.abs(this.escala[m] - alvo) ? i : m, 0);
      } else {
        this.nota = Math.max(0, Math.min(this.escala.length - 1, this.nota + Math.floor(Math.random() * 5) - 2));
      }
      const f = midi(this.escala[this.nota]);
      Som.tom(f, t, 1.3, { vol: 0.055, destino: dest, eco: true });
      Som.tom(f * 2, t, 0.35, { vol: 0.012, destino: dest });
    }
  },
};

const W = 800, H = 504;     // tamanho do mundo
const CEU = 56;             // faixa de céu no topo da tela
const TELA_W = 800, TELA_H = H + CEU;
const canvas = $('fazenda');
const tela = canvas.getContext('2d');
tela.imageSmoothingEnabled = false;
const mundo = novoCanvas(W, H);
const ctxMundo = mundo.getContext('2d');
let c = ctxMundo; // contexto atual

function novoCanvas(w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; }
function comCtx(ctx, fn) { const antigo = c; c = ctx; fn(); c = antigo; }
function R(x, y, w, h, cor) { c.fillStyle = cor; c.fillRect(Math.round(x), Math.round(y), w, h); }
function circulo(cx, cy, r, cor) {
  c.fillStyle = cor;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5);
    c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function elipse(cx, cy, rx, ry, cor) {
  c.fillStyle = cor;
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / ry) * (dy / ry))));
    c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1);
  }
}
function sombra(cx, cy, rx, ry) { elipse(cx, cy, rx, ry, 'rgba(30,40,10,.22)'); }
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function misturar(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function telhado(cx, yTopo, linhas, larguraTopo, cores, borda) {
  for (let i = 0; i < linhas; i++) {
    const w = larguraTopo + i * 2;
    R(cx - w / 2, yTopo + i, w, 1, cores[i % cores.length]);
    if (i % 2 === 0) for (let k = (i % 4 ? 2 : 0); k < w; k += 4) R(cx - w / 2 + k, yTopo + i, 1, 1, borda);
  }
  const wb = larguraTopo + (linhas - 1) * 2;
  R(cx - wb / 2, yTopo + linhas - 1, wb, 1, borda);
}
function neveTelhado(cx, yTopo, linhas, larguraTopo) {
  if (!inverno()) return;
  for (let i = 0; i < Math.min(linhas, 4); i++) { const w = larguraTopo + i * 2; R(cx - w / 2, yTopo + i, w, 1, i % 2 ? '#eef4fa' : '#ffffff'); }
}

// Sprites a partir de "desenhos" em texto, com contorno automático
function criarSprite(linhas, paleta, contorno) {
  const h = linhas.length, w = Math.max(...linhas.map(l => l.length));
  const cv = novoCanvas(w + 2, h + 2), x = cv.getContext('2d');
  const cheio = (i, j) => j >= 0 && j < h && i >= 0 && i < (linhas[j] || '').length && paleta[linhas[j][i]];
  if (contorno) {
    x.fillStyle = contorno;
    for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (cheio(i, j)) continue;
      if (cheio(i - 1, j) || cheio(i + 1, j) || cheio(i, j - 1) || cheio(i, j + 1)) x.fillRect(i + 1, j + 1, 1, 1);
    }
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < linhas[j].length; i++) {
    const cor = paleta[linhas[j][i]];
    if (cor) { x.fillStyle = cor; x.fillRect(i + 1, j + 1, 1, 1); }
  }
  return cv;
}
function espelhar(cv) {
  const e = novoCanvas(cv.width, cv.height), x = e.getContext('2d');
  x.translate(cv.width, 0); x.scale(-1, 1); x.drawImage(cv, 0, 0);
  return e;
}
function conjunto(quadros, paleta, contorno) {
  const r = {};
  for (const k in quadros) { const d = criarSprite(quadros[k], paleta, contorno); r[k] = { d, e: espelhar(d) }; }
  return r;
}

const CATS_LOJA = [['limpeza', '🧹 Limpeza'], ['plantacoes', '🌱 Plantações'], ['animais', '🐾 Animais'], ['construcoes', '🏠 Construções'], ['ferramentas', '🧰 Ferramentas'], ['decoracao', '🌷 Decoração']];
// 'disponivel' | 'nivel' (próximo nível) | 'requisito' | 'misterio' | 'obra' | 'feito' | null (não aparece)
function visivelNaLoja(item) {
  if (item.unico && tem(item.id)) {
    if (item.linha && tierLinha(item.linha) !== item.tier) return null; // versão antiga: deixa de aparecer
    return 'feito';
  }
  if (estado.obra && estado.obra.id === item.id) return 'obra';
  if (item.linha && item.tier !== tierLinha(item.linha) + 1) return null;
  if (item.nivel > estado.nivel + 1) return null;
  if (item.nivel > estado.nivel) return 'nivel';
  if (item.req && !item.req.every(([id, n]) => qtd(id) >= n)) {
    const visiveis = item.req.every(([id]) => { const v = visivelNaLoja(ITEM[id]); return v && v !== 'misterio' && v !== 'nivel'; });
    return visiveis ? 'requisito' : 'misterio';
  }
  return 'disponivel';
}
function textoReq(item) {
  return item.req.filter(([id, n]) => qtd(id) < n).map(([id, n]) => n > 1 ? `${n}× ${ITEM[id].nome}` : ITEM[id].nome).join(' + ');
}
function rendaUnidade(item) {
  const est = estacao();
  let r = item.renda * bonusGlobal();
  if (item.cat === 'plantacoes') { r *= multPlantas() * fatorEstacao(item, est); if (item.produz === 'flores') r *= 1 + 0.3 * contarFuncao('jardineiro') * multEquipe(); }
  else r *= multAnimais() * (item.casa ? fatorCasa(item.casa, est) : 1);
  if (item.produz) r = r / PRODUTOS[item.produz].preco * precoVenda(item.produz);
  return r;
}
function infoExtra(item) {
  const nomesEst = l => l.map(i => ESTACOES[i].ico + ' ' + ESTACOES[i].nome).join(', ');
  if (item.planta === 'estufa') return `🪟 Na estufa: ${qtd('tomate') + qtd('morango')}/${capEstufa()} canteiros · produz o ano todo${item.favor ? ' · favorita: ' + nomesEst(item.favor) : ''}`;
  if (item.planta === 'inverno') return '❄️ Rende mais no inverno';
  if (item.planta) return `Favorita: ${nomesEst(item.favor || [])} · ❄️ inverno: 25%`;
  if (item.casa) { const [ab, tot] = animaisAbrigados(item.casa); return `🏠 Abrigo no inverno: ${ab}/${tot} abrigados (${dadoLinha(item.casa).nome})`; }
  return '';
}

}

function desbloquearComFesta(h) {

}

function desenharMina(t, dt) {

      const col = i % COLS, lin = Math.floor(i / COLS);

      elipse(x + 13, y + 12, 6, 4, tons[2]);

  e.preventDefault();
  Som.iniciar();
  toque.id = e.pointerId; toque.x0 = e.clientX; toque.y0 = e.clientY; toque.tipo = e.pointerType;
  toque.camX = camera.x; toque.camY = camera.y; toque.moveu = false;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== toque.id) return;
  const dx = e.clientX - toque.x0, dy = e.clientY - toque.y0;
  const limite = toque.tipo === 'touch' ? 10 : 6; // folga para não confundir clique com arrasto
  if (!toque.moveu && Math.hypot(dx, dy) > limite) { toque.moveu = true; canvas.classList.add('arrastando'); }
  if (toque.moveu && camera.zoom > 1) {
    const r = canvas.getBoundingClientRect(), esc = TELA_W / r.width / camera.zoom;
    camera.alvoX = camera.alvoY = null;
    camera.x = toque.camX - dx * esc; camera.y = toque.camY - dy * esc;
    limitarCamera();
    tutorial.arrastou = true;
  }
});
function soltar(e) {
  if (e.pointerId !== toque.id) return;
  const foiClique = !toque.moveu && e.type === 'pointerup';
  toque.id = null;
  canvas.classList.remove('arrastando');
  if (foiClique) cliqueNaFazenda(e);
}
canvas.addEventListener('pointerup', soltar);
canvas.addEventListener('pointercancel', soltar);
canvas.addEventListener('contextmenu', e => e.preventDefault());

let ultimoSomAnimal = 0;
function cliqueNaFazenda(e) {
  const [px, py, r] = pontoCanvas(e);
  const ganho = valorClique();
  ganhar(ganho);
  estado.cliques++;
  if (inverno()) estado.contadores.cliquesInverno++;
  adiantarObra(SEG_POR_CLIQUE_OBRA);
  const rw = wrap.getBoundingClientRect();
  const f = el('div', 'flutua', '+' + fmt(ganho));
  f.style.left = (e.clientX - rw.left) + 'px'; f.style.top = (e.clientY - rw.top) + 'px';
  wrap.appendChild(f); setTimeout(() => f.remove(), 900);
  if (py < CEU) { Som.clique(); return; }
  const [wx, wy] = telaParaMundo(px, py);
  poeira(wx, wy, ['#ffe066', '#ffd93d', '#fff6b0'], 5, 35);
  // entrada da mina
  if (tem('minaEntrada') && wx > 760 && wy < 70) { abrirMina(); return; }
  // espantalho (conquista secreta)
  if (tem('espantalho') && Math.abs(wx - 660) < 8 && wy > 448 && wy < 480) { estado.contadores.espantalho++; Som.passarinho(0.06); }
  // pets e animais respondem
  const alvo = animais.find(a => Math.abs(a.x - wx) < 9 && wy < a.y + 3 && wy > a.y - 16);
  if (alvo && performance.now() - ultimoSomAnimal > 300) {
    ultimoSomAnimal = performance.now();
    Som.animal(alvo.tipo === 'gato' ? (Math.random() < 0.5 ? 'gato' : 'ronrom') : alvo.tipo);
    coracao(alvo.x, alvo.y - 16);
    estado.contadores.carinhos++;
    if (alvo.tipo === 'gato') estado.contadores.carinhosGato++;
    if (alvo.tipo === 'cachorro') estado.contadores.carinhosCachorro++;
    alvo.pulo = 1; alvo.espera = Math.max(alvo.espera, 1);
  } else Som.clique();
}
// setas do teclado também movem a câmera
const teclas = {};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) { teclas[e.key] = true; e.preventDefault(); }
  Som.iniciar();
});
addEventListener('keyup', e => { delete teclas[e.key]; });
function moverPorTeclas(dt) {
  if (camera.zoom === 1) return;
  const v = 160 * dt;
  if (teclas.ArrowLeft) camera.x -= v; if (teclas.ArrowRight) camera.x += v;
  if (teclas.ArrowUp) camera.y -= v; if (teclas.ArrowDown) camera.y += v;
  if (Object.keys(teclas).length) { camera.alvoX = camera.alvoY = null; limitarCamera(); tutorial.arrastou = true; }
}

// ---------- Botões ----------
$('btnVerTudo').addEventListener('click', () => {
  const cx = camera.x + vistaW() / 2, cy = camera.y + vistaH() / 2;
  camera.zoom = camera.zoom === 1 ? 2 : 1;
  camera.alvoX = camera.alvoY = null;
  if (camera.zoom === 1) { camera.x = 0; camera.y = 0; } else centrarCamera(cx, cy, false);
  $('btnVerTudo').textContent = camera.zoom === 1 ? '🔎 Aproximar' : '🔍 Ver fazenda inteira';
  tutorial.arrastou = true;
});
function atualizarBotoesSom() {
  $('btnMusica').classList.toggle('desligado', !config.musica);
  $('btnEfeitos').classList.toggle('desligado', !config.efeitos);
  $('btnMusica').textContent = config.musica ? '🎵' : '🔇';
  $('btnEfeitos').textContent = config.efeitos ? '🔊' : '🔈';
}
$('btnMusica').addEventListener('click', () => { config.musica = !config.musica; salvarConfig(); Som.iniciar(); Som.ajustar(); atualizarBotoesSom(); });
$('btnEfeitos').addEventListener('click', () => { config.efeitos = !config.efeitos; salvarConfig(); Som.iniciar(); Som.ajustar(); atualizarBotoesSom(); if (config.efeitos) Som.clique(); });
$('btnTelaCheia').addEventListener('click', () => {
  const d = document, raiz = d.documentElement;
  const ativo = d.fullscreenElement || d.webkitFullscreenElement;
  if (ativo) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else if (raiz.requestFullscreen) raiz.requestFullscreen().catch(() => {});
  else if (raiz.webkitRequestFullscreen) raiz.webkitRequestFullscreen();
});
document.addEventListener('fullscreenchange', () => { $('btnTelaCheia').textContent = document.fullscreenElement ? '🗗' : '⛶'; setTimeout(ajustarCeu, 50); });
$('btnLateral').addEventListener('click', () => {
  const p = $('principal');
  p.classList.toggle('sem-lateral');
  $('btnLateral').classList.toggle('desligado', p.classList.contains('sem-lateral'));
  $('btnLateral').title = p.classList.contains('sem-lateral') ? 'Mostrar a loja' : 'Esconder a loja';
  setTimeout(ajustarCeu, 30);
});
$('btnReiniciar').addEventListener('click', () => abrirConfirmacao('🔄 Reiniciar o jogo?', 'Todo o progresso (itens, níveis, habilidades, equipe e conquistas) será perdido e a fazenda voltará a ficar abandonada. Tem certeza?', 'Sim, recomeçar', () => {
  try { localStorage.removeItem(CHAVE_SAVE); } catch (e) {}
  estado = novoEstado();
  animais = []; pessoas = []; particulas = [];
  painelAtual = 'loja'; abaLoja = 'limpeza'; fecharMina();
  Object.assign(tutorial, { arrastou: false, vistoObjetivo: false, minaAberta: false });
  camera.zoom = 2; centrarCamera(400, 250, false); $('btnVerTudo').textContent = '🔍 Ver fazenda inteira';
  calcularFluxos(); redesenharCaches(); abrirPainel('loja'); atualizarTudo(true); salvar();
  abrirNomeFazenda(true);
}));
modal.addEventListener('click', e => { if (e.target === modal && caixaModal.querySelector('[data-nao]')) fecharModal(); });
addEventListener('resize', () => { ajustarCeu(); if (!balao.hidden && alvoTutorial) posicionarBalao(alvoTutorial); });
document.addEventListener('pointerdown', () => Som.iniciar());

// =====================================================================
// INÍCIO
// =====================================================================
const tinhaSave = carregar();
calcularFluxos();
if (tinhaSave) {
  const fora = (Date.now() - (estado.salvoEm || Date.now())) / 1000;
  if (fora > 10) {
    const g = simularAusencia(fora);
    if (g >= 1) setTimeout(() => avisar(`🌙 Enquanto você esteve fora (${fmtTempo(Math.min(fora, 7200))}), a fazenda rendeu 🪙 ${fmt(g)}!`, '', 5000), 600);
  }
}
carregando = false;
centrarCamera(400, 250, false);
redesenharCaches();
sincronizarAnimais(); sincronizarPessoas();
aplicarNome();
abrirPainel('loja');
atualizarTudo(true);
atualizarBotoesSom();
ajustarCeu();
verificarConquistas(tinhaSave);
if (versaoNova) {
  abrirModal(`<h2>🌻 Nova versão da Fazendinha!</h2><p>A fazenda ficou <b>muito maior</b>: novas áreas, níveis, árvore de habilidades, produtos artesanais, encomendas, estações do ano, ajudantes e uma mina!</p>
    <p>Como mudou muita coisa, <b>o seu progresso antigo recomeçou do zero</b>. Como agradecimento por jogar desde o começo, você ganhou a conquista secreta <b>🎖️ Fundador</b>.</p>
    <div class="botoes"><button class="btn verde" data-ok>Vamos lá!</button></div>`, cx => { cx.querySelector('[data-ok]').onclick = () => { fecharModal(); abrirNomeFazenda(true); }; });
} else if (!estado.nome) abrirNomeFazenda(true);
else setTimeout(() => avisar(`🌻 Bem-vindo de volta à <b>${estado.nome}</b>!`), 200);

// =====================================================================
// LOOP PRINCIPAL
// =====================================================================
let ultimoQuadro = performance.now(), ultimoReal = Date.now(), acum = 0, acumLento = 0, assinaturaRotulos = '';
function assinaturaR() {
  return Object.keys(LIMITES).concat(['abelhas']).map(qtd).join(',') + '|' + estado.equipe.length + '|' + estado.nivel + '|' + inverno() + '|' + tem('placa') + estado.nome;
}
function quadro(t) {
  const dtv = Math.max(0, Math.min(0.1, (t - ultimoQuadro) / 1000));
  ultimoQuadro = t;
  const agora = Date.now();
  const dtr = (agora - ultimoReal) / 1000;
  ultimoReal = agora;
  if (dtr > 5) { // voltou de outra aba: simula o tempo que passou
    const g = simularAusencia(dtr);
    if (g >= 1) avisar(`🌙 Enquanto a aba estava em segundo plano, a fazenda rendeu 🪙 ${fmt(g)}!`);
  } else if (dtr > 0) { tick(dtr); estado.tempoJogo += dtr; }

  acum += dtv; acumLento += dtv;
  if (acum > 0.25) {
    acum = 0;
    verificarNivel();
    verificarConquistas(false);
    avisosDeEstacao();
    dicaOcasional(t);
    atualizarTudo(false);
    atualizarTutorial();
    if (mina.aberta) atualizarTopoMina();
  }
  if (acumLento > 1) {
    acumLento = 0;
    sincronizarAnimais();
    const a = assinaturaR();
    if (a !== assinaturaRotulos) { assinaturaRotulos = a; montarRotulos(); }
    $('btnMina').hidden = !tem('minaEntrada');
    // sons do ambiente de vez em quando
    if (Math.random() < 0.06) {
      const tipos = Object.keys(LIMITES).filter(k => visiveisAnimal(k) > 0);
      if (tipos.length && Math.random() < 0.7) Som.animal(escolhe(tipos), 0.4);
      else if (!inverno() && tem('cerca')) Som.passarinho(0.03);
    }
  }
  moverPorTeclas(dtv);
  moverCameraSuave(dtv);
  atualizarAnimais(dtv);
  atualizarPessoas(dtv);
  atualizarParticulas(dtv);
  compor(t, dtv);
  posicionarRotulos();
  desenharMina(t, dtv);
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

setInterval(salvar, 5000);
addEventListener('beforeunload', salvar);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { salvar(); if (Som.ctx) Som.ctx.suspend(); }
  else if (Som.ctx) Som.ctx.resume();
});

// Ganchos para testes automatizados (só com ?teste na URL)
if (location.search.includes('teste')) window.__fazenda = { get estado() { return estado; }, get pessoas() { return pessoas; }, get animais() { return animais; }, set estado(v) { estado = v; }, ITEM, tick, comprar, calcularFluxos, redesenharCaches, sincronizarAnimais, sincronizarPessoas, atualizarTudo, abrirPainel, contratar, camera, abrirMina, verificarNivel, montarRotulos, mina, verificarConquistas };
})();
</script>
